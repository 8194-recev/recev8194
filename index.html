<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a5d2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נהגים ורכבים">
<title>ניהול נהגים ורכבים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --surface-2:#f8f9f5; --border:#e3e5dd; --border-strong:#cfd3c6;
  --text:#1c2016; --muted:#686d61; --faint:#9a9e93;
  --accent:#4a5d2c; --accent-hover:#3d4d24; --accent-soft:#eef1e5; --accent-ink:#ffffff;
  --ok:#2b7a46; --ok-bg:#e5f3e9; --warn:#a96300; --warn-bg:#fcf0da; --bad:#bf3a2e; --bad-bg:#fbe8e5;
  --info:#2c61ac; --info-bg:#e6eefa; --neutral-bg:#eef0ea;
  --shadow-sm:0 1px 2px rgba(20,24,15,.06); --shadow:0 4px 18px rgba(20,24,15,.08); --shadow-lg:0 18px 50px rgba(20,24,15,.18);
  --r:12px; --r-sm:8px; --side:248px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111310; --surface:#1a1d17; --surface-2:#20241c; --border:#2c3127; --border-strong:#3a4034;
  --text:#e9ebe4; --muted:#a2a79a; --faint:#71766b;
  --accent:#8fa65e; --accent-hover:#a2b971; --accent-soft:#252c1b; --accent-ink:#11140c;
  --ok:#5cc07c; --ok-bg:#16301f; --warn:#e3a13b; --warn-bg:#33270f; --bad:#ec6b5f; --bad-bg:#3a1a17;
  --info:#6f9fe6; --info-bg:#172540; --neutral-bg:#252922;
  --shadow-sm:none; --shadow:0 4px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo .ic{width:21px;height:21px}
.brand b{display:block;font-size:15.5px;font-weight:700;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:start}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.me .av{width:34px;height:34px;font-size:13px}
.me b{display:block;font-size:13.5px;line-height:1.25}
.me small{color:var(--muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top .mbrand{display:none}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:40px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:0 40px 0 12px}
.search input:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.search>.ic{position:absolute;inset-inline-start:12px;top:11px;color:var(--faint)}
.sres{position:absolute;top:46px;inset-inline:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:380px;overflow:auto;padding:6px;z-index:30}
.sres button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:start}
.sres button:hover{background:var(--surface-2)}
.sres .empty{padding:14px;color:var(--muted);text-align:center}
.top-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.rolepick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 4px 0 10px;height:40px;color:var(--muted);font-size:13px}
.rolepick select{border:0;background:none;height:38px;color:var(--text);font-weight:500;cursor:pointer}
.view{padding:26px 28px 60px;max-width:1440px;width:100%;margin:0 auto}
.demo{display:flex;align-items:center;gap:10px;background:var(--info-bg);color:var(--info);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:13.5px}
.demo b{font-weight:600}
.demo .btn{margin-inline-start:auto}

/* ---------- page ---------- */
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.phead .sub{margin:2px 0 0;color:var(--muted)}
.phead .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card>header{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card>header h2{margin:0;font-size:15.5px;font-weight:600}
.card>header .more{margin-inline-start:auto;font-size:13px}
.card .body{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid2.wide{grid-template-columns:1.6fr 1fr}
.grid2>*,.set-grid>*,.kpis>*{min-width:0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px 18px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--border-strong)}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.kpi .lbl .ic{color:var(--faint)}
.kpi .val{font-size:30px;font-weight:700;line-height:1.1;margin-top:10px;letter-spacing:-.02em}
.kpi .val small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .foot{margin-top:10px;font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--neutral-bg);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:6px}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-info{color:var(--info)}.t-muted{color:var(--muted)}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:20px;padding:2px 10px 2px 10px;white-space:nowrap;line-height:20px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.muted{background:var(--neutral-bg);color:var(--muted)}
.badge.plain::before{display:none}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 7px;line-height:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.muted{background:var(--neutral-bg);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--neutral-bg);color:var(--text);border-radius:6px;padding:0 8px;font-size:12.5px;line-height:22px;white-space:nowrap}
.chip.off{opacity:.55;text-decoration:line-through}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;padding:0}.btn.icon.sm{width:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.input,.select{height:38px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:0 11px;min-width:0}
.input:focus,.select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.tb-search{position:relative;flex:1;min-width:200px;max-width:340px}
.tb-search .input{width:100%;padding-inline-start:36px}
.tb-search .ic{position:absolute;inset-inline-start:11px;top:10px;color:var(--faint)}
.seg{display:inline-flex;background:var(--neutral-bg);border-radius:10px;padding:3px;gap:2px}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;flex:none;border:0;background:none;border-radius:7px;padding:0 12px;height:32px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.seg .n{font-size:11.5px;color:var(--faint);font-weight:600}

/* table */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:start;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl th:first-child{border-start-start-radius:var(--r)}.tbl th:last-child{border-start-end-radius:var(--r)}
.who{display:flex;align-items:center;gap:11px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:none}
.who b{display:block;font-weight:600;line-height:1.25}
.who small{color:var(--muted);font-size:12.5px}
.vid{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cards{display:none}
.empty-state{padding:44px 20px;text-align:center;color:var(--muted)}
.empty-state .ic{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.empty-state b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:4px}
.matrix th{font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 6px;text-align:center;white-space:nowrap}
.matrix th.u{text-align:start;color:var(--text)}
.matrix td{text-align:center;border-radius:8px;padding:8px 4px;font-size:13px;min-width:74px}
.matrix td b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.matrix td .of{font-size:11.5px;font-weight:500;color:var(--muted)}
.matrix td small{color:var(--muted);font-size:11.5px}
.matrix td.c-ok{background:var(--ok-bg)}.matrix td.c-ok b{color:var(--ok)}
.matrix td.c-warn{background:var(--warn-bg)}.matrix td.c-warn b{color:var(--warn)}
.matrix td.c-bad{background:var(--bad-bg)}.matrix td.c-bad b{color:var(--bad)}
.matrix td.c-none{background:none;color:var(--faint)}

/* list rows (dashboard) */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600}
.row small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,18,12,.38);z-index:60;animation:fade .15s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(580px,100%);background:var(--bg);z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.dh{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px}
.dh .tt{display:flex;align-items:flex-start;gap:13px}
.dh .av{width:48px;height:48px;font-size:17px}
.dh h2{margin:0;font-size:19px;font-weight:700;line-height:1.25}
.dh .meta{color:var(--muted);font-size:13px;margin-top:2px}
.dh .x{margin-inline-start:auto}
.dh .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.db{flex:1;overflow:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sec h3{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .btn{margin-inline-start:auto}
.reasons{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;font-size:13.5px}
.reasons.bad{background:var(--bad-bg);color:var(--bad)}.reasons.warn{background:var(--warn-bg);color:var(--warn)}.reasons.info{background:var(--info-bg);color:var(--info)}
.reasons ul{margin:0;padding:0;list-style:none}
.reasons li{font-weight:500}
.kv .r{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.kv .r:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:1}
.kv .p{min-width:118px;display:flex;justify-content:flex-end}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.kv2 .k{color:var(--muted);font-size:12.5px}
.kv2 .v{font-weight:500}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.tl .it:last-child{border-bottom:0}
.tl .d{color:var(--muted);white-space:nowrap;min-width:64px}
.foot-note{color:var(--faint);font-size:12px;text-align:center}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(15,18,12,.45);animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.sm{width:min(440px,100%)}.modal.lg{width:min(820px,100%)}
.mh{display:flex;align-items:center;padding:18px 22px 6px}
.mh h2{margin:0;font-size:18px;font-weight:700}
.mh .btn{margin-inline-start:auto}
.mb{padding:12px 22px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--border)}
.mf .start{margin-inline-end:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form .full{grid-column:1/-1}
.form h4{grid-column:1/-1;margin:8px 0 -4px;font-size:13px;color:var(--muted);font-weight:600;border-top:1px solid var(--border);padding-top:14px}
.form h4:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:500}
.fld label i{color:var(--bad);font-style:normal}
.fld .input,.fld .select,.fld textarea{width:100%}
.fld textarea{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:72px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.fld.err .input{border-color:var(--bad)}
.fld .msg{font-size:12px;color:var(--bad)}
.perm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.perm{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:9px;padding:6px 10px}
.perm input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.perm span{flex:1;font-weight:500}
.perm .input{height:32px;width:140px;font-size:13px}
.perm.off .input{visibility:hidden}

/* settings */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-ed{display:flex;flex-direction:column}
.list-ed .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.list-ed .li:last-child{border-bottom:0}
.list-ed .li .grow{flex:1}
.list-ed .li small{color:var(--muted)}

/* toast */
.toasts{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1d2117;color:#fff;border-radius:10px;padding:10px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;font-size:13.5px;animation:fade .2s}
.toast.bad{background:var(--bad)}.toast.ok .ic{color:#8fd6a5}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:34px 30px;text-align:center}
.login .logo{width:56px;height:56px;margin:0 auto 16px;border-radius:14px}
.login .logo .ic{width:30px;height:30px}
.login h1{margin:0;font-size:21px}
.login p{color:var(--muted);margin:6px 0 24px}
.login .btn{width:100%;height:44px}

/* bottom nav (mobile) */
.bnav{display:none}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2.wide,.set-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .top .mbrand{display:flex;align-items:center;gap:9px;font-weight:700}
  .top .mbrand .logo{width:32px;height:32px;border-radius:9px}
  .top .mbrand .logo .ic{width:18px;height:18px}
  .search{order:5;flex-basis:100%;max-width:none}
  .rolepick span{display:none}
  .view{padding:16px 14px 96px}
  .phead h1{font-size:21px}
  .phead .acts{margin-inline-start:0;width:100%}
  .phead .acts .btn{height:36px;padding:0 12px;font-size:13.5px}
  .kpis{gap:10px}
  .kpi{padding:13px 14px}
  .kpi .val{font-size:25px}
  .tbl-wrap.resp{display:none}
  .cards{display:flex;flex-direction:column;gap:10px}

const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n] || ''}</svg>`;

/* ---------- constants ---------- */
const COLS = ['units', 'types', 'drivers', 'vehicles', 'faults', 'maint', 'users', 'audit'];
const DEFAULT_SETTINGS = { battalion: 'גדוד', warnDays: 30, refresherMonths: 12, serviceWarnDays: 14, serviceWarnKm: 500, trackMedical: false };
const GRADES = ['B', 'C1', 'C', 'C+E'];
const DEFAULT_TYPES = () => ['האמר', 'אושקוש', 'מתן', 'טטרה', 'אמבולנס', 'דודג׳'].map((name, i) => ({ id: 't' + (i + 1), name, grade: '', serviceDays: 180, serviceKm: 5000 }));
const RANKS = ['טוראי', 'רב״ט', 'סמ״ר', 'סמל', 'רס״ל', 'רס״ר', 'רס״מ', 'סג״ם', 'סגן', 'סרן', 'אזרח עובד צה״ל'];
const SERVICE = ['סדיר', 'קבע', 'מילואים'];
const AVAIL = ['ביחידה', 'בבית', 'בקורס', 'בחופשה'];
const ROLE_LABEL = { admin: 'קצין רכב', company: 'מפקד פלוגה', hq: 'מפקדת גדוד' };
const LV_LABEL = { ok: 'כשיר', warn: 'עומד לפקוע', bad: 'לא כשיר' };
const LV_ORDER = { bad: 0, info: 1, warn: 2, ok: 3 };

/* ---------- state ---------- */
const S = {
  data: Object.fromEntries(COLS.map(c => [c, []])),
  settings: { ...DEFAULT_SETTINGS },
  user: null,
  mode: CONFIG.firebase ? 'cloud' : CONFIG.demo ? 'demo' : 'local',
  route: 'dashboard',
  drawer: null,
  f: {
    drivers: { q: '', unit: '', status: '' },
    vehicles: { q: '', unit: '', type: '', status: '' },
    faults: { status: 'open', unit: '' },
  },
};

/* ---------- permissions ---------- */
function can(act, obj) {
  const r = S.user?.role;
  if (r === 'admin') return true;
  if (r === 'company') {
    const own = !obj || obj.unitId === S.user.unitId;
    return ['driver.basic', 'fault.open', 'vehicle.km'].includes(act) && own;
  }
  return false;
}
const isAdmin = () => S.user?.role === 'admin';
const scoped = arr => S.user?.role === 'company' ? arr.filter(x => x.unitId === S.user.unitId) : arr;

/* ---------- lookups ---------- */
const unitName = id => id ? (S.data.units.find(u => u.id === id)?.name || 'ללא שיוך') : 'ללא שיוך';
const typeOf = v => S.data.types.find(t => t.id === v?.typeId);
const typeName = id => S.data.types.find(t => t.id === id)?.name || '—';
const unitsSorted = () => [...S.data.units].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || byName(a, b));
const typesSorted = () => [...S.data.types].sort(byName);

/* ---------- readiness: drivers ----------
   permits = { typeId: 'YYYY-MM-DD' (last refresher on that type) | '' (authorized, refresher not done) } */
const hasPermit = (d, id) => !!d.permits && Object.prototype.hasOwnProperty.call(d.permits, id);
const permitRefDate = (d, id) => (d.permits?.[id]) || d.refresherDate || '';
const permitExp = (d, id) => { const r = permitRefDate(d, id); return r ? addMonths(r, S.settings.refresherMonths) : ''; };
const gradeOk = (d, t) => !t?.grade || !d.civilGrade || GRADES.indexOf(d.civilGrade) >= GRADES.indexOf(t.grade);
function permitValid(d, id) {
  const t = S.data.types.find(x => x.id === id);
  const n = daysUntil(permitExp(d, id));
  return hasPermit(d, id) && n != null && n >= 0 && gradeOk(d, t);
}
function driverItems(d) {
  const out = [{ key: 'civilExp', label: 'רישיון אזרחי', date: d.civilExp }];
  if (d.milExp || d.hasMil !== true) out.push({ key: 'milExp', label: 'רישיון צבאי', date: d.milExp, none: d.hasMil === false });
  if (S.settings.trackMedical) out.push({ key: 'medicalExp', label: 'כשירות רפואית', date: d.medicalExp });
  return out;
}
function driverStatus(d) {
  const reasons = []; let lv = 'ok';
  const bump = l => { if (LV_ORDER[l] < LV_ORDER[lv]) lv = l; };
  if (d.suspended?.active) {
    reasons.push('מושעה מנהיגה' + (d.suspended.reason ? ' – ' + d.suspended.reason : '') + (d.suspended.until ? ' (עד ' + fmtDate(d.suspended.until) + ')' : ''));
    bump('bad');
  }
  for (const it of driverItems(d)) {
    const n = daysUntil(it.date);
    if (n == null) { if (it.none) { reasons.push('אין ' + it.label); bump('bad'); } else { reasons.push('חסר תאריך: ' + it.label); bump('warn'); } }
    else if (n < 0) { reasons.push(`${it.label} פג תוקף לפני ${-n} ימים`); bump('bad'); }
    else if (n <= S.settings.warnDays) { reasons.push(`${it.label} פג בעוד ${n} ימים`); bump('warn'); }
  }
  const ids = Object.keys(d.permits || {});
  if (!ids.length) { reasons.push('אין היתרים לסוגי רכב'); bump('bad'); }
  else {
    for (const id of ids) {
      const t = S.data.types.find(x => x.id === id); const nm = t?.name || '?';
      const n = daysUntil(permitExp(d, id));
      if (!gradeOk(d, t)) { reasons.push(`${nm}: נדרש רישיון ${t.grade}`); bump('warn'); }
      else if (n == null) { reasons.push(`לא עבר ריענון על ${nm}`); bump('warn'); }
      else if (n < 0) { reasons.push(`ריענון ${nm} פג לפני ${-n} ימים`); bump('warn'); }
      else if (n <= S.settings.warnDays) { reasons.push(`ריענון ${nm} פג בעוד ${n} ימים`); bump('warn'); }
    }
    if (!ids.some(id => permitValid(d, id))) { reasons.unshift('אין אף סוג רכב עם ריענון בתוקף'); bump('bad'); }
  }
  const label = d.suspended?.active ? 'מושעה' : LV_LABEL[lv];
  return { lv, label, reasons };
}
function driverNextExpiry(d) {
  const all = [
    ...driverItems(d).filter(i => i.date).map(i => ({ label: i.label, date: i.date })),
    ...Object.keys(d.permits || {}).map(id => ({ label: 'ריענון ' + typeName(id), date: permitExp(d, id) })).filter(i => i.date),
  ];
  return all.map(i => ({ ...i, days: daysUntil(i.date) })).sort((a, b) => a.days - b.days)[0] || null;
}

/* ---------- readiness: vehicles ---------- */
function vService(v) {
  const t = typeOf(v);
  if (!v.lastServiceDate) return null;
  const dueDate = t?.serviceDays ? addDays(v.lastServiceDate, t.serviceDays) : null;
  const hasKm = t?.serviceKm && v.lastServiceKm !== '' && v.lastServiceKm != null;
  const dueKm = hasKm ? Number(v.lastServiceKm) + Number(t.serviceKm) : null;
  return {
    dueDate, dueKm,
    daysLeft: dueDate ? daysUntil(dueDate) : null,
    kmLeft: (dueKm != null && v.km !== '' && v.km != null) ? dueKm - Number(v.km) : null,
  };
}
const openFaults = v => S.data.faults.filter(f => f.vehicleId === v.id && f.status !== 'סגורה');
function vehicleStatus(v) {
  const reasons = []; let lv = 'ok';
  const bump = l => { if (LV_ORDER[l] < LV_ORDER[lv]) lv = l; };
  const fl = openFaults(v);
  const prev = fl.filter(f => f.severity === 'מונעת');
  if (v.inWorkshop) { reasons.push('הרכב בסדנה / בטיפול'); bump('info'); }
  prev.forEach(f => { reasons.push('תקלה מונעת: ' + f.text); bump('bad'); });
  fl.filter(f => f.severity !== 'מונעת').forEach(f => { reasons.push('תקלה פתוחה: ' + f.text); bump('warn'); });
  const s = vService(v);
  if (!s) { reasons.push('אין רישום טיפול תקופתי'); bump('warn'); }
  else {
    if (s.daysLeft != null && s.daysLeft < 0) { reasons.push(`טיפול תקופתי באיחור של ${-s.daysLeft} ימים`); bump('bad'); }
    else if (s.daysLeft != null && s.daysLeft <= S.settings.serviceWarnDays) { reasons.push(`טיפול תקופתי בעוד ${s.daysLeft} ימים`); bump('warn'); }
    if (s.kmLeft != null && s.kmLeft < 0) { reasons.push(`חריגה של ${fmtNum(-s.kmLeft)} ק״מ ממועד הטיפול`); bump('bad'); }
    else if (s.kmLeft != null && s.kmLeft <= S.settings.serviceWarnKm) { reasons.push(`טיפול תקופתי בעוד ${fmtNum(s.kmLeft)} ק״מ`); bump('warn'); }
  }
  let label = { ok: 'כשיר', warn: 'כשיר במגבלה', bad: 'מושבת', info: 'בטיפול' }[lv];
  if (v.inWorkshop && lv !== 'bad') label = 'בטיפול';
  return { lv, label, reasons };
}
const vehicleUsable = v => { const s = vehicleStatus(v); return s.lv === 'ok' || s.lv === 'warn'; };
const driverUsable = d => driverStatus(d).lv !== 'bad';

/* ---------- data store ---------- */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (S.user) App.refresh(); });
}
const clean = o => JSON.parse(JSON.stringify(o));

const Store = {
  backend: null,
  all: c => S.data[c],
  get: (c, id) => S.data[c].find(x => x.id === id),
  put(c, obj, auditText) {
    obj.id = obj.id || uid();
    obj.updatedAt = new Date().toISOString();
    obj.updatedBy = S.user?.name || '';
    Promise.resolve(this.backend.put(c, clean(obj))).catch(e => toast('שגיאה בשמירה: ' + e.message, 'bad'));
    if (auditText) this.log(auditText);
    return obj;
  },
  remove(c, id, auditText) {
    Promise.resolve(this.backend.remove(c, id)).catch(e => toast('שגיאה במחיקה: ' + e.message, 'bad'));
    if (auditText) this.log(auditText);
  },
  log(text) {
    const a = { id: uid(), at: new Date().toISOString(), by: S.user?.name || '', text };
    Promise.resolve(this.backend.put('audit', a)).catch(() => {});
  },
  saveSettings(s) {
    S.settings = { ...DEFAULT_SETTINGS, ...s };
    Promise.resolve(this.backend.putSettings(S.settings)).catch(e => toast('שגיאה בשמירה: ' + e.message, 'bad'));
    this.log('עודכנו הגדרות המערכת');
    scheduleRender();
  },
};

const DemoBackend = {

  remove(c, id) { S.data[c] = S.data[c].filter(x => x.id !== id); scheduleRender(); },
  putSettings() { scheduleRender(); },
};

/* local backend – this browser only (localStorage), used until the cloud is connected */
const LS_KEY = 'gdud-fleet-v1';
const LocalBackend = {
  timer: null,
  async init() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.data) {
      for (const c of COLS) S.data[c] = saved.data[c] || [];
      S.settings = { ...DEFAULT_SETTINGS, ...(saved.settings || {}) };
    } else {
      S.data.types = DEFAULT_TYPES();
    }
    S.user = { name: 'קצין רכב', role: 'admin', unitId: '', email: '' };
  },
  save() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, at: new Date().toISOString(), data: S.data, settings: S.settings })); }
      catch (e) { toast('השמירה במכשיר נכשלה – כדאי להוריד גיבוי מלא', 'bad'); }
    }, 300);
  },
  put(c, o) { DemoBackend.put(c, o); this.save(); },
  remove(c, id) { DemoBackend.remove(c, id); this.save(); },
  putSettings() { this.save(); scheduleRender(); },
};

/* cloud backend – Firebase (Firestore + Google sign-in) */
const FB_VER = '10.14.1';
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('טעינה נכשלה: ' + src)); document.head.appendChild(s); });
}
const FireBackend = {
  db: null, unsub: [],
  async init() {
    for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(CONFIG.firebase);
    this.db = firebase.firestore();
    try { await this.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* already enabled / unsupported */ }
    return new Promise(resolve => {
      firebase.auth().onAuthStateChanged(async u => {
        if (!u) { App.showLogin(); return; }
        const email = (u.email || '').toLowerCase();
        let doc;
        try { doc = await this.db.collection('users').doc(email).get(); }
        catch (e) { App.showLogin('לא ניתן לבדוק הרשאות: ' + e.message); return; }
        const owner = String(CONFIG.owner || '').toLowerCase();
        if (!doc.exists && owner && email === owner) {
          /* first sign-in of the system owner: create the admin user + default vehicle types */
          try {
            await this.db.collection('users').doc(email).set({ name: u.displayName || 'קצין רכב', role: 'admin', unitId: '' });
            const ts = await this.db.collection('types').limit(1).get();
            if (ts.empty) { const b = this.db.batch(); DEFAULT_TYPES().forEach(t => { const { id, ...rest } = t; b.set(this.db.collection('types').doc(id), rest); }); await b.commit(); }
            doc = await this.db.collection('users').doc(email).get();
          } catch (e) { App.showLogin('יצירת משתמש המנהל נכשלה: ' + e.message + ' – בדוק שחוקי האבטחה הודבקו ב-Firestore.'); return; }
        }
        if (!doc.exists) { App.showLogin(`לחשבון ${email} אין הרשאה למערכת. פנה לקצין הרכב כדי שיוסיף אותך.`, true); return; }
        const p = doc.data();
        S.user = { name: p.name || u.displayName || email, email, role: p.role || 'hq', unitId: p.unitId || '' };
        this.subscribe();
        resolve();
      });
    });
  },
  subscribe() {
    const r = S.user.role;
    for (const c of COLS) {
      let q = this.db.collection(c);
      if (c === 'users' && r !== 'admin') continue;
      if (c === 'audit') { if (r === 'company') continue; q = q.orderBy('at', 'desc').limit(300); }
      if (r === 'company' && ['drivers', 'vehicles', 'faults', 'maint'].includes(c)) q = q.where('unitId', '==', S.user.unitId || '-');
      this.unsub.push(q.onSnapshot(snap => {
        S.data[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        scheduleRender();
      }, err => toast('שגיאת סנכרון (' + c + '): ' + err.message, 'bad')));
    }
    this.unsub.push(this.db.collection('meta').doc('settings').onSnapshot(d => {
      if (d.exists) S.settings = { ...DEFAULT_SETTINGS, ...d.data() };
      scheduleRender();
    }, () => {}));
  },
  put(c, o) { const { id, ...rest } = o; return this.db.collection(c).doc(id).set(rest, { merge: true }); },
  remove(c, id) { return this.db.collection(c).doc(id).delete(); },
  putSettings(s) { return this.db.collection('meta').doc('settings').set(s); },
  signIn() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    return firebase.auth().signInWithPopup(p).catch(e => {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'].includes(e.code)) return firebase.auth().signInWithRedirect(p);
      if (['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) return;
      throw e;
    });
  },
  signOut() { return firebase.auth().signOut().then(() => location.reload()); },
};

/* =========================================================

const badge = st => `<span class="badge ${st.lv}">${esc(st.label)}</span>`;
function daysPill(n, warn = S.settings.warnDays, due = false) {
  if (n == null) return '<span class="pill muted">אין נתון</span>';
  if (n < 0) return `<span class="pill bad">${due ? 'באיחור של' : 'פג לפני'} ${-n} ימים</span>`;
  if (n === 0) return `<span class="pill bad">${due ? 'היום' : 'פג היום'}</span>`;
  const txt = n > 90 ? `עוד ${Math.round(n / 30)} חודשים` : `עוד ${n} ימים`;
  return `<span class="pill ${n <= warn ? 'warn' : 'ok'}">${txt}</span>`;
}
function kmPill(k) {
  if (k == null) return '<span class="pill muted">—</span>';
  if (k < 0) return `<span class="pill bad">חריגה ${fmtNum(-k)} ק״מ</span>`;
  return `<span class="pill ${k <= S.settings.serviceWarnKm ? 'warn' : 'ok'}">עוד ${fmtNum(k)} ק״מ</span>`;
}
const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`;
const unitOptions = (sel, withAll = true) => (withAll ? opt('', 'כל הפלוגות', sel) : '') + unitsSorted().map(u => opt(u.id, u.name, sel)).join('') + opt('__none', 'ללא שיוך', sel);

function fld(label, name, val = '', o = {}) {
  const { type = 'text', req, hint, full, opts, attrs = '', ph = '' } = o;
  let ctl;
  if (opts) ctl = `<select class="select" name="${name}" ${attrs}>${opts.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return opt(v, l, val); }).join('')}</select>`;
  else if (type === 'textarea') ctl = `<textarea name="${name}" placeholder="${esc(ph)}" ${attrs}>${esc(val)}</textarea>`;
  else ctl = `<input class="input" type="${type}" name="${name}" value="${esc(val ?? '')}" placeholder="${esc(ph)}" ${attrs}>`;
  return `<div class="fld ${full ? 'full' : ''}" data-f="${name}"><label>${esc(label)}${req ? ' <i>*</i>' : ''}</label>${ctl}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`;
}
function fieldErr(form, name, msg) {
  const f = form.querySelector(`[data-f="${name}"]`);
  if (f) { f.classList.add('err'); f.insertAdjacentHTML('beforeend', `<div class="msg">${esc(msg)}</div>`); }
}
const getter = fd => k => (fd.get(k) ?? '').toString().trim();

function modal({ title, body, submit = 'שמירה', size = '', onSubmit, danger = false, foot = '', onMount }) {
  const host = $('#modal');
  host.innerHTML = `<div class="modal-wrap"><form class="modal ${size}" novalidate>
    <div class="mh"><h2>${esc(title)}</h2><button type="button" class="btn ghost icon sm" data-close aria-label="סגירה">${ic('x')}</button></div>
    <div class="mb">${body}</div>
    <div class="mf">${foot}<button type="button" class="btn" data-close>${onSubmit ? 'ביטול' : 'סגירה'}</button>${onSubmit ? `<button class="btn ${danger ? 'danger solid' : 'primary'}" type="submit">${esc(submit)}</button>` : ''}</div>
  </form></div>`;
  const form = host.querySelector('form');
  host.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  host.querySelector('.modal-wrap').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-wrap')) closeModal(); });
  form.onsubmit = e => {
    e.preventDefault();
    form.querySelectorAll('.fld.err').forEach(f => { f.classList.remove('err'); f.querySelector('.msg')?.remove(); });
    const ok = onSubmit ? onSubmit(new FormData(form), form) : true;
    if (ok !== false) closeModal();
  };
  if (onMount) onMount(form);
  setTimeout(() => form.querySelector('.mb input:not([type=hidden]):not([type=checkbox]):not([disabled]), .mb select, .mb textarea')?.focus(), 60);
  return form;
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmBox(title, text, onYes, yes = 'אישור', danger = true) {
  modal({ title, size: 'sm', body: `<p style="margin:0">${text}</p>`, submit: yes, danger, onSubmit: () => { onYes(); } });
}
function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = (kind === 'ok' ? ic('check', 'sm') : ic('alert', 'sm')) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'bad' ? 5000 : 2600);
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click();
  });
}

    const a = document.activeElement;
    const typing = a && a.closest && a.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    this.renderView(!typing);
    this.renderDrawer();
  },

  renderView(full) {
    const v = VIEWS[S.route];
    if (full) $('#view').innerHTML = demoBanner() + v.page();
    else if (v.list && $('#list')) $('#list').innerHTML = v.list();
  },

  openDrawer(type, id) { S.drawer = { type, id }; this.renderDrawer(); },
  closeDrawer() { S.drawer = null; $('#drawer').innerHTML = ''; },
  renderDrawer() {
    const host = $('#drawer');
    if (!S.drawer) { host.innerHTML = ''; return; }
    const col = S.drawer.type === 'driver' ? 'drivers' : 'vehicles';
    const obj = Store.get(col, S.drawer.id);
    if (!obj) { this.closeDrawer(); return; }
    const scroll = host.querySelector('.db')?.scrollTop || 0;
    const fresh = !host.innerHTML;
    host.innerHTML = `<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog">${S.drawer.type === 'driver' ? driverDrawer(obj) : vehicleDrawer(obj)}</aside>`;
    if (!fresh) { host.querySelector('.scrim').style.animation = 'none'; host.querySelector('.drawer').style.animation = 'none'; }
    const db = host.querySelector('.db'); if (db) db.scrollTop = scroll;
  },
};

function demoBanner() {
  if (S.mode === 'local') return `<div class="demo">${ic('info')}<span><b>שמירה מקומית.</b> הנתונים נשמרים בדפדפן של המכשיר הזה בלבד. מומלץ להוריד מדי פעם גיבוי מלא (הגדרות ← נתונים).</span></div>`;
  if (S.mode !== 'demo') return '';
  const what = window.GDUD_SEED_DRIVERS ? `הנהגים נטענו מהקובץ שלך (${window.GDUD_SEED_DRIVERS.length}); הרכבים והפלוגות לדוגמה.` : 'הנתונים לדוגמה.';
  return `<div class="demo">${ic('info')}<span><b>מצב הדגמה.</b> ${what} שינויים נשמרים רק עד רענון הדף. אחרי החיבור לענן הכל יישמר ויסונכרן בין כל המשתמשים.</span></div>`;
}

/* ---------- dashboard ---------- */

        ${S.mode === 'cloud' && IO.localSaved() ? `<button class="btn primary" data-act="migrate">${ic('upload')}העלאת ${IO.localSaved().data.drivers.length} הנהגים מהמכשיר</button>` : ''}

function kpi(label, icon, n, tot, foot, route) {
  const pct = tot ? Math.round(n / tot * 100) : 0;
  const c = pct >= 85 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
  return `<div class="card kpi" data-act="nav" data-route="${route}"><div class="lbl">${ic(icon)}${label}</div>
    <div class="val"><span class="num">${n}</span> <small>מתוך ${tot}</small></div>
    <div class="bar"><i class="b-${c}" style="width:${pct}%"></i></div><div class="foot">${foot}</div></div>`;
}
function expiringItems(D, V) {
  const out = [];
  for (const d of D) {
    const its = [...driverItems(d), ...Object.keys(d.permits || {}).map(id => ({ label: 'ריענון ' + typeName(id), date: permitExp(d, id) }))];
    for (const it of its) {
      const n = daysUntil(it.date);
      if (n != null && n <= S.settings.warnDays) out.push({ kind: 'driver', id: d.id, title: d.name, sub: `${it.label} · ${unitName(d.unitId)}`, days: n, date: it.date });
    }
  }
  for (const v of V) {
    const s = vService(v);
    if (s && s.daysLeft != null && s.daysLeft <= S.settings.serviceWarnDays) out.push({ kind: 'vehicle', id: v.id, title: `${typeName(v.typeId)} ${v.number}`, sub: `טיפול תקופתי · ${unitName(v.unitId)}`, days: s.daysLeft, date: s.dueDate });
  }
  return out.sort((a, b) => a.days - b.days);
}
function expiringHTML(items) {
  if (!items.length) return `<div class="empty-state">${ic('check')}<b>אין פקיעות קרובות</b>כל התוקפים בסדר</div>`;
  return `<div class="rows">${items.slice(0, 9).map(x => `
    <div class="row" data-act="open-${x.kind}" data-id="${esc(x.id)}">
      <div class="av" style="width:32px;height:32px;font-size:12px">${x.kind === 'driver' ? esc(initials(x.title)) : ic('truck', 'sm')}</div>
      <div class="grow"><b>${esc(x.title)}</b><small>${esc(x.sub)} · ${fmtDate(x.date)}</small></div>${daysPill(x.days, S.settings.warnDays, x.kind === 'vehicle')}
    </div>`).join('')}</div>${items.length > 9 ? `<div class="foot-note" style="margin-top:8px">ועוד ${items.length - 9} פריטים</div>` : ''}`;
}
function matrixHTML(D, V) {
  let units = S.user.role === 'company' ? S.data.units.filter(u => u.id === S.user.unitId) : unitsSorted();
  if (S.user.role !== 'company' && (D.some(d => !d.unitId) || V.some(v => !v.unitId))) units = [...units, { id: '', name: 'ללא שיוך' }];
  const types = typesSorted().filter(t => V.some(v => v.typeId === t.id) || D.some(d => hasPermit(d, t.id)));
  if (!units.length || !types.length) return `<div class="empty-state">${ic('grid')}<b>אין עדיין נתונים</b>הוסף פלוגות, סוגי רכב ורכבים כדי לראות את המטריצה</div>`;
  const cell = (u, t) => {
    const vs = V.filter(v => (v.unitId || '') === u.id && v.typeId === t.id);
    const fit = vs.filter(vehicleUsable).length;
    const ds = D.filter(d => (d.unitId || '') === u.id && permitValid(d, t.id) && driverUsable(d)).length;
    if (!vs.length && !ds) return `<td class="c-none">—</td>`;
    let c = !vs.length ? 'c-none' : fit === vs.length ? 'c-ok' : fit / vs.length >= .5 ? 'c-warn' : 'c-bad';
    if (vs.length && c === 'c-ok' && ds < fit) c = 'c-warn';
    return `<td class="${c}" data-act="goto" data-route="vehicles" data-unit="${u.id || '__none'}" data-type="${t.id}" style="cursor:pointer"><b>${vs.length ? `${fit}<span class="of"> מתוך ${vs.length}</span>` : '<span class="of">אין רכבים</span>'}</b><small>${ds} נהגים</small></td>`;
  };
  return `<div class="tbl-wrap"><table class="matrix"><thead><tr><th></th>${types.map(t => `<th>${esc(t.name)}</th>`).join('')}</tr></thead>
    <tbody>${units.map(u => `<tr><th class="u">${esc(u.name)}</th>${types.map(t => cell(u, t)).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="foot-note" style="text-align:start;margin-top:8px">בכל תא: רכבים כשירים מתוך סה״כ, ונהגים כשירים עם היתר לסוג. כתום = חסרים נהגים או רכבים לא כשירים.</div>`;
}
function faultsMini(F) {

  const list = [...F].sort((a, b) => (a.severity === 'מונעת' ? 0 : 1) - (b.severity === 'מונעת' ? 0 : 1) || String(b.openedAt).localeCompare(String(a.openedAt)));
  return `<div class="rows">${list.slice(0, 6).map(f => {

    return `<div class="row" data-act="open-vehicle" data-id="${esc(f.vehicleId)}"><span class="dot" style="background:var(--${f.severity === 'מונעת' ? 'bad' : 'warn'})"></span>
      <div class="grow"><b>${esc(f.text)}</b><small>${esc(typeName(v?.typeId))} ${esc(v?.number || '')} · ${esc(unitName(f.unitId))} · ${esc(f.status)}</small></div>
      <span class="pill ${f.severity === 'מונעת' ? 'bad' : 'warn'}">${esc(f.severity)}</span></div>`;
  }).join('')}</div>`;
}
function availHTML(D) {
  let units = S.user.role === 'company' ? S.data.units.filter(u => u.id === S.user.unitId) : unitsSorted();
  if (S.user.role !== 'company' && D.some(d => !d.unitId)) units = [...units, { id: '', name: 'ללא שיוך' }];

    return `<div class="row" data-act="goto" data-route="drivers" data-unit="${u.id || '__none'}"><div class="grow"><b>${esc(u.name)}</b><small>${here} ביחידה מתוך ${ds.length} · ${fit} מהם כשירים</small>
      <div class="bar" style="margin-top:6px"><i class="b-ok" style="width:${Math.round(fit / ds.length * 100)}%"></i></div></div></div>`;
  }).join('')}</div>`;
}

    const fl = v => { const o = openFaults(v); if (!o.length) return '<span class="t-muted">—</span>'; const p = o.some(f => f.severity === 'מונעת'); return `<span class="pill ${p ? 'bad' : 'warn'}">${o.length} ${o.length === 1 ? 'פתוחה' : 'פתוחות'}</span>`; };
    return `<div class="card tbl-wrap resp"><table class="tbl"><thead><tr><th>רכב</th><th>פלוגה</th><th>ק״מ</th><th>טיפול הבא</th><th>תקלות</th><th>מיקום</th><th>סטטוס</th></tr></thead><tbody>
      ${rows.map(v => `<tr data-act="open-vehicle" data-id="${esc(v.id)}">
        <td><div class="who"><div class="av">${ic('truck', 'sm')}</div><div><b class="vid">${esc(v.number)}</b><small>${esc(typeName(v.typeId))}</small></div></div></td>
        <td>${esc(unitName(v.unitId))}</td><td><span class="num">${fmtNum(v.km)}</span></td><td>${svc(v)}</td><td>${fl(v)}</td><td>${esc(v.location || '—')}</td><td>${badge(vehicleStatus(v))}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="cards">${rows.map(v => `<div class="mcard" data-act="open-vehicle" data-id="${esc(v.id)}">
      <div class="r1"><div class="av">${ic('truck', 'sm')}</div><div class="who"><div><b class="vid">${esc(v.number)}</b><small>${esc(typeName(v.typeId))} · ${esc(unitName(v.unitId))}</small></div></div>${badge(vehicleStatus(v))}</div>
      <div class="r2"><span>${fmtNum(v.km)} ק״מ</span><span>${fl(v)}</span></div></div>`).join('')}</div>`;
  },
};

/* ---------- faults ---------- */
function faultsFiltered() {
  const f = S.f.faults;
  return scoped(S.data.faults).filter(x => {
    if (f.status === 'open' && x.status === 'סגורה') return false;
    if (f.status === 'closed' && x.status !== 'סגורה') return false;
    if (f.unit === '__none' ? x.unitId : (f.unit && x.unitId !== f.unit)) return false;
    return true;
  }).sort((a, b) => (a.status === 'סגורה') - (b.status === 'סגורה') || (a.severity === 'מונעת' ? 0 : 1) - (b.severity === 'מונעת' ? 0 : 1) || String(b.openedAt).localeCompare(String(a.openedAt)));
}
VIEWS.faults = {
  page() {
    const f = S.f.faults, all = scoped(S.data.faults);
    const seg = [['open', 'פתוחות', all.filter(x => x.status !== 'סגורה').length], ['closed', 'סגורות', all.filter(x => x.status === 'סגורה').length], ['all', 'הכל', all.length]];
    return `
      <div class="phead"><div><h1>תקלות</h1><p class="sub">מעקב תקלות ברכבים, מהפתיחה ועד הסגירה</p></div>
        <div class="acts">${can('fault.open') ? `<button class="btn primary" data-act="open-fault">${ic('plus')}פתיחת תקלה</button>` : ''}</div></div>
      <div class="toolbar">
        <div class="seg">${seg.map(([v, l, n]) => `<button class="${f.status === v ? 'on' : ''}" data-act="setf" data-k="faults.status" data-v="${v}">${l} <span class="n">${n}</span></button>`).join('')}</div>
        ${S.user.role !== 'company' ? `<select class="select" data-filter="faults.unit">${unitOptions(f.unit)}</select>` : ''}
      </div>
      <div class="card list" id="list">${this.list()}</div>`;
  },
  list() {
    const rows = faultsFiltered();
    if (!rows.length) return `<div class="empty-state">${ic('check')}<b>אין תקלות להצגה</b></div>`;
    const acts = f => !isAdmin() ? '' : f.status === 'סגורה' ? '' :
      `${f.status === 'פתוחה' ? `<button class="btn sm" data-act="fault-progress" data-id="${esc(f.id)}">לטיפול</button>` : ''}<button class="btn sm" data-act="fault-close" data-id="${esc(f.id)}">${ic('check', 'sm')}סגירה</button>`;
    const stPill = f => `<span class="badge ${f.status === 'סגורה' ? 'muted' : f.status === 'בטיפול' ? 'info' : f.severity === 'מונעת' ? 'bad' : 'warn'}">${esc(f.status)}</span>`;
    return `<div class="card tbl-wrap resp"><table class="tbl"><thead><tr><th>רכב</th><th>תקלה</th><th>חומרה</th><th>נפתחה</th><th>סטטוס</th><th></th></tr></thead><tbody>
      ${rows.map(f => { const v = Store.get('vehicles', f.vehicleId); return `<tr data-act="open-vehicle" data-id="${esc(f.vehicleId)}">
        <td><b class="vid">${esc(v?.number || '?')}</b><br><small class="t-muted">${esc(typeName(v?.typeId))} · ${esc(unitName(f.unitId))}</small></td>
        <td>${esc(f.text)}${f.closeNote ? `<br><small class="t-muted">טיפול: ${esc(f.closeNote)}</small>` : ''}</td>
        <td><span class="pill ${f.severity === 'מונעת' ? 'bad' : 'warn'}">${esc(f.severity)}</span></td>
        <td><small>${fmtDateTime(f.openedAt)}<br><span class="t-muted">${esc(f.openedBy || '')}</span></small></td>
        <td>${stPill(f)}</td><td style="white-space:nowrap">${acts(f)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="cards">${rows.map(f => { const v = Store.get('vehicles', f.vehicleId); return `<div class="mcard" data-act="open-vehicle" data-id="${esc(f.vehicleId)}">
      <div class="r1"><div><b>${esc(f.text)}</b><br><small class="t-muted">${esc(typeName(v?.typeId))} ${esc(v?.number || '')} · ${esc(unitName(f.unitId))}</small></div>${stPill(f)}</div>
      <div class="r2"><span class="pill ${f.severity === 'מונעת' ? 'bad' : 'warn'}">${esc(f.severity)}</span><span>${fmtDateTime(f.openedAt)}</span></div>
      ${acts(f) ? `<div style="display:flex;gap:8px">${acts(f)}</div>` : ''}</div>`; }).join('')}</div>`;
  },
};

        <div><div class="k">טיפול הבא לפי ק״מ</div><div class="v">${s?.dueKm != null ? `<span class="num">${fmtNum(s.dueKm)}</span> ` + kmPill(s.kmLeft) : '—'}</div></div>

      </div></div>
      <div class="sec"><h3>${ic('alert', 'sm')}תקלות פתוחות</h3>
        ${open.length ? `<div class="list-ed">${open.map(f => `<div class="li"><span class="dot" style="background:var(--${f.severity === 'מונעת' ? 'bad' : 'warn'})"></span><div class="grow"><b>${esc(f.text)}</b><br><small>${esc(f.severity)} · ${esc(f.status)} · ${fmtDateTime(f.openedAt)} · ${esc(f.openedBy || '')}</small></div>
          ${isAdmin() ? `${f.status === 'פתוחה' ? `<button class="btn sm" data-act="fault-progress" data-id="${esc(f.id)}">לטיפול</button>` : ''}<button class="btn sm" data-act="fault-close" data-id="${esc(f.id)}">סגירה</button>` : ''}</div>`).join('')}</div>` : '<div class="t-muted">אין תקלות פתוחות</div>'}
      </div>
      <div class="sec"><h3>${ic('history', 'sm')}היסטוריה</h3>
        ${hist.length ? `<div class="tl">${hist.map(h => `<div class="it"><span class="d">${fmtDate(h.at)}</span><span style="flex:1">${esc(h.txt)}</span></div>`).join('')}</div>` : '<div class="t-muted">אין רישומים</div>'}
      </div>
      ${v.notes ? `<div class="sec"><h3>הערות</h3>${esc(v.notes)}</div>` : ''}
      <div class="foot-note">עודכן ${fmtDateTime(v.updatedAt)}${v.updatedBy ? ' ע״י ' + esc(v.updatedBy) : ''}</div>
    </div>`;
}

/* =========================================================
   Actions, forms and global events
   ========================================================= */
const ACT = {
  nav: d => { App.closeDrawer(); App.go(d.route); },
  goto: d => {
    App.closeDrawer();
    const f = S.f[d.route];
    if (f) {
      f.unit = d.unit || ''; f.status = d.status || '';
      if ('type' in f) f.type = d.type || '';
      if ('q' in f) f.q = '';
    }
    App.go(d.route);
  },
  setf: d => { const [view, key] = d.k.split('.'); S.f[view][key] = d.v; App.renderView(true); },
  'open-driver': d => App.openDrawer('driver', d.id),
  'open-vehicle': d => App.openDrawer('vehicle', d.id),
  'close-drawer': () => App.closeDrawer(),
  theme: () => { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); App.renderChrome(); },
  signin: () => FireBackend.signIn().catch(e => toast(e.message, 'bad')),
  logout: () => FireBackend.signOut(),

  /* drivers */
  'add-driver': () => driverForm(),
  'edit-driver': d => driverForm(Store.get('drivers', d.id)),
  'driver-basic': d => driverBasicForm(Store.get('drivers', d.id)),
  suspend: d => suspendForm(Store.get('drivers', d.id)),
  unsuspend: d => {
    const x = Store.get('drivers', d.id);
    confirmBox('ביטול השעיה', `לבטל את ההשעיה של ${esc(x.name)}?`, () => {
      Store.put('drivers', { ...x, suspended: { active: false, reason: '', until: '' } }, `בוטלה השעיה: ${x.name} (${x.pn})`);
      toast('ההשעיה בוטלה');
    }, 'ביטול השעיה', false);

  'add-event': d => eventForm(Store.get('drivers', d.id)),
  'del-event': d => {
    const x = Store.get('drivers', d.id);

      Store.put('drivers', { ...x, events: (x.events || []).filter(e => e.id !== d.ev) }, `נמחק אירוע נהיגה: ${x.name}`);
    }, 'מחיקה');

  /* vehicles & faults */

  km: d => kmForm(Store.get('vehicles', d.id)),

    toast(v.inWorkshop ? 'הרכב הוחזר מהסדנה' : 'הרכב סומן בסדנה');
  },
  'open-fault': d => faultForm(d.id ? Store.get('vehicles', d.id) : null),
  'fault-progress': d => {
    const f = Store.get('faults', d.id);
    Store.put('faults', { ...f, status: 'בטיפול' }, `תקלה הועברה לטיפול: ${f.text}`);
    toast('התקלה הועברה לטיפול');
  },
  'fault-close': d => closeFaultForm(Store.get('faults', d.id)),

  /* settings */
  'unit-add': () => unitForm(),
  'unit-edit': d => unitForm(Store.get('units', d.id)),
  'unit-del': d => {

    const n = S.data.drivers.filter(x => x.unitId === u.id).length + S.data.vehicles.filter(x => x.unitId === u.id).length;
    confirmBox('מחיקת פלוגה', `למחוק את ${esc(u.name)}?${n ? ` ${n} נהגים ורכבים ששויכו אליה יעברו ל"ללא שיוך".` : ''}`, () => {
      S.data.drivers.filter(x => x.unitId === u.id).forEach(x => Store.put('drivers', { ...x, unitId: '' }));
      S.data.vehicles.filter(x => x.unitId === u.id).forEach(x => Store.put('vehicles', { ...x, unitId: '' }));
      Store.remove('units', u.id, `נמחקה פלוגה: ${u.name}`);
    }, 'מחיקה');
  },
  'type-add': () => typeForm(),

  'type-del': d => {
    const t = Store.get('types', d.id);

    if (n) { toast(`לא ניתן למחוק – ${n} רכבים משויכים לסוג הזה`, 'bad'); return; }
    confirmBox('מחיקת סוג רכב', `למחוק את ${esc(t.name)}? ההיתרים לסוג הזה יוסרו מהנהגים.`, () => {
      S.data.drivers.filter(x => x.permits?.[t.id]).forEach(x => { const p = { ...x.permits }; delete p[t.id]; Store.put('drivers', { ...x, permits: p }); });
      Store.remove('types', t.id, `נמחק סוג רכב: ${t.name}`);
    }, 'מחיקה');
  },
  'user-add': () => userForm(),
  'user-edit': d => userForm(Store.get('users', d.id)),
  'user-del': d => {
    const u = Store.get('users', d.id);
    confirmBox('הסרת משתמש', `להסיר את ההרשאה של ${esc(u.name || u.id)}?`, () => Store.remove('users', u.id, `הוסר משתמש: ${u.id}`), 'הסרה');
  },

  /* data */
  template: () => IO.template(),
  import: () => IO.importFile(),
  export: () => IO.exportAll(),
  backup: () => IO.backup(),
  restore: () => IO.restore(),
  migrate: () => IO.migrateLocal(),
};

function bindGlobalEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACT[el.dataset.act]) return;
    if (el.tagName === 'A') e.preventDefault();
    ACT[el.dataset.act](el.dataset, el, e);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.filter && el.tagName === 'INPUT') {
      const [v, k] = el.dataset.filter.split('.'); S.f[v][k] = el.value;
      App.renderView(false);
    }
    if (el.id === 'gsearch') globalSearch(el.value);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.filter && el.tagName === 'SELECT') {
      const [v, k] = el.dataset.filter.split('.'); S.f[v][k] = el.value;
      App.renderView(true);
    }
    if (el.dataset.actChange === 'role') switchRole(el.value);
  });
  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.dataset.form === 'general') {
      e.preventDefault();
      const g = getter(new FormData(f));
      const num = (k, def) => { const n = parseInt(g(k), 10); return isNaN(n) ? def : n; };
      Store.saveSettings({
        battalion: g('battalion') || DEFAULT_SETTINGS.battalion, warnDays: num('warnDays', 30), refresherMonths: num('refresherMonths', 12),
        serviceWarnDays: num('serviceWarnDays', 14), serviceWarnKm: num('serviceWarnKm', 500), trackMedical: g('trackMedical') === 'yes',
      });
      document.activeElement?.blur();
      toast('ההגדרות נשמרו');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if (S.drawer) App.closeDrawer(); else if ($('#sres')?.innerHTML) $('#sres').innerHTML = ''; }
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); $('#gsearch')?.focus(); }
  });
  document.addEventListener('focusout', e => { if (e.target.id === 'gsearch') setTimeout(() => { if ($('#sres')) $('#sres').innerHTML = ''; }, 180); });
}

function switchRole(v) {
  App.closeDrawer();
  if (v === 'admin') S.user = { name: 'קצין רכב (הדגמה)', role: 'admin', unitId: '' };
  else if (v === 'hq') S.user = { name: 'סמג״ד (הדגמה)', role: 'hq', unitId: '' };
  else { const id = v.split(':')[1]; S.user = { name: 'מ״פ ' + unitName(id) + ' (הדגמה)', role: 'company', unitId: id }; }
  for (const k of Object.keys(S.f)) if ('unit' in S.f[k]) S.f[k].unit = '';
  App.go(S.route);
  toast('תצוגה: ' + ROLE_LABEL[S.user.role]);
}

function globalSearch(q) {
  const box = $('#sres'); q = q.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const ds = scoped(S.data.drivers).filter(d => `${d.name} ${d.pn}`.toLowerCase().includes(q)).slice(0, 6);
  const vs = scoped(S.data.vehicles).filter(v => `${v.number} ${typeName(v.typeId)}`.toLowerCase().includes(q)).slice(0, 6);
  box.innerHTML = `<div class="sres">${!ds.length && !vs.length ? '<div class="empty">לא נמצאו תוצאות</div>' : ''}
    ${ds.map(d => `<button data-act="open-driver" data-id="${esc(d.id)}"><div class="av" style="width:30px;height:30px;font-size:12px">${esc(initials(d.name))}</div><div style="flex:1"><b>${esc(d.name)}</b><br><small class="t-muted num">${esc(d.pn)}</small> <small class="t-muted">· ${esc(unitName(d.unitId))}</small></div>${badge(driverStatus(d))}</button>`).join('')}
    ${vs.map(v => `<button data-act="open-vehicle" data-id="${esc(v.id)}"><div class="av" style="width:30px;height:30px">${ic('truck', 'sm')}</div><div style="flex:1"><b class="vid">${esc(v.number)}</b><br><small class="t-muted">${esc(typeName(v.typeId))} · ${esc(unitName(v.unitId))}</small></div>${badge(vehicleStatus(v))}</button>`).join('')}</div>`;
}

/* ---------- forms: drivers ---------- */
function driverForm(d) {
  const isNew = !d; d = d || { permits: {}, availability: 'ביחידה', service: 'מילואים', unitId: S.f.drivers.unit && S.f.drivers.unit !== '__none' ? S.f.drivers.unit : '' };
  const types = typesSorted();
  const permRows = types.map(t => {
    const has = hasPermit(d, t.id);
    return `<div class="perm ${has ? '' : 'off'}"><label style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer"><input type="checkbox" name="perm_${t.id}" ${has ? 'checked' : ''}><span>${esc(t.name)} ${t.grade ? `<small class="t-muted">(${esc(t.grade)})</small>` : ''}</span></label><input class="input" type="date" name="permd_${t.id}" value="${esc(d.permits?.[t.id] || '')}" title="תאריך ריענון אחרון"></div>`;
  }).join('');
  modal({
    title: isNew ? 'נהג חדש' : 'עריכת נהג', size: 'lg', submit: isNew ? 'הוספת נהג' : 'שמירה',
    foot: !isNew ? `<button type="button" class="btn danger start" id="delDriver">${ic('trash', 'sm')}מחיקה</button>` : '',
    body: `<div class="form">
      <h4>פרטים אישיים</h4>
      ${fld('מספר אישי', 'pn', d.pn, { req: true, attrs: `inputmode="numeric" ${isNew ? '' : 'disabled'}`, hint: isNew ? '' : 'לא ניתן לשנות מספר אישי' })}
      ${fld('שם מלא', 'name', d.name, { req: true })}
      ${fld('דרגה', 'rank', d.rank, { opts: [['', 'בחר…'], ...RANKS] })}
      ${fld('פלוגה', 'unitId', d.unitId, { opts: [['', 'ללא שיוך'], ...unitsSorted().map(u => [u.id, u.name])] })}
      ${fld('טלפון', 'phone', d.phone, { type: 'tel', attrs: 'inputmode="tel"' })}
      ${fld('סוג שירות', 'service', d.service, { opts: SERVICE })}
      ${fld('זמינות', 'availability', d.availability, { opts: AVAIL })}
      <h4>רישיונות וכשירות</h4>
      ${fld('דרגת רישיון אזרחי', 'civilGrade', d.civilGrade, { opts: [['', 'בחר…'], ...GRADES] })}
      ${fld('תוקף רישיון אזרחי', 'civilExp', d.civilExp, { type: 'date' })}
      ${fld('מספר רישיון צבאי', 'milLicenseNo', d.milLicenseNo, { attrs: 'inputmode="numeric"' })}
      ${fld('תוקף רישיון צבאי', 'milExp', d.milExp, { type: 'date' })}
      ${fld('תוקף כשירות רפואית', 'medicalExp', d.medicalExp, { type: 'date' })}
      ${fld('רישיון צבאי', 'hasMil', d.hasMil === true ? 'yes' : d.hasMil === false ? 'no' : '', { opts: [['', 'לא ידוע'], ['yes', 'יש'], ['no', 'אין']] })}
      <h4>היתרים וריענון אחרון לכל סוג רכב <small style="font-weight:400">(ריענון תקף ${S.settings.refresherMonths} חודשים)</small></h4>
      <div class="full">${types.length ? `<div class="perm-grid">${permRows}</div>` : '<div class="t-muted">הגדר סוגי רכב בהגדרות כדי לסמן היתרים</div>'}</div>
      ${fld('הערות', 'notes', d.notes, { type: 'textarea', full: true })}
    </div>`,
    onMount: form => {
      form.querySelectorAll('.perm input[type=checkbox]').forEach(cb => cb.onchange = () => {
        const row = cb.closest('.perm'); row.classList.toggle('off', !cb.checked);
        
      });
      form.querySelector('#delDriver')?.addEventListener('click', () => {
        confirmBox('מחיקת נהג', `למחוק את ${esc(d.name)} (${esc(d.pn)}) לצמיתות?`, () => { App.closeDrawer(); Store.remove('drivers', d.id, `נמחק נהג: ${d.name} (${d.pn})`); toast('הנהג נמחק'); }, 'מחיקה');
      });
    },
    onSubmit: (fd, form) => {
      const g = getter(fd);
      const pn = isNew ? g('pn') : d.pn;
      let bad = false;
      if (!/^\d{5,9}$/.test(pn)) { fieldErr(form, 'pn', 'מספר אישי צריך להכיל 5–9 ספרות'); bad = true; }
      else if (isNew && Store.get('drivers', safeId(pn))) { fieldErr(form, 'pn', 'נהג עם המספר האישי הזה כבר קיים'); bad = true; }
      if (!g('name')) { fieldErr(form, 'name', 'שדה חובה'); bad = true; }
      if (bad) return false;
      const permits = {};
      types.forEach(t => { if (fd.get('perm_' + t.id)) permits[t.id] = g('permd_' + t.id); });
      const obj = {
        ...d, id: safeId(pn), pn, name: g('name'), rank: g('rank'), unitId: g('unitId'), phone: g('phone'), service: g('service'),
        availability: g('availability'), civilGrade: g('civilGrade'), civilExp: g('civilExp'), milLicenseNo: g('milLicenseNo'),
        milExp: g('milExp'), medicalExp: g('medicalExp'), hasMil: g('hasMil') === 'yes' ? true : g('hasMil') === 'no' ? false : null, permits, notes: g('notes'),
        events: d.events || [], suspended: d.suspended || { active: false },
      };
      Store.put('drivers', obj, `${isNew ? 'נוסף' : 'עודכן'} נהג: ${obj.name} (${obj.pn})`);
      toast(isNew ? 'הנהג נוסף' : 'השינויים נשמרו');
      if (isNew) App.openDrawer('driver', obj.id);
    },
  });
}

    onSubmit: fd => { const g = getter(fd); Store.put('drivers', { ...d, availability: g('availability'), phone: g('phone') }, `עודכנה זמינות: ${d.name}`); toast('עודכן'); },

function suspendForm(d) {

function eventForm(d) {

/* ---------- forms: vehicles ---------- */
function vehicleForm(v) {

    body: `<div class="form">
      ${fld('מספר רכב', 'number', v.number, { req: true, attrs: isNew ? '' : 'disabled', hint: isNew ? '' : 'לא ניתן לשנות מספר רכב' })}
      ${fld('סוג רכב', 'typeId', v.typeId, { req: true, opts: [['', 'בחר…'], ...typesSorted().map(t => [t.id, t.name])] })}
      ${fld('פלוגה', 'unitId', v.unitId, { opts: [['', 'ללא שיוך'], ...unitsSorted().map(u => [u.id, u.name])] })}
      ${fld('מיקום', 'location', v.location, { ph: 'חניון גדודי' })}
      ${fld('ק״מ נוכחי', 'km', v.km, { type: 'number', attrs: 'min="0"' })}

      ${fld('ק״מ בטיפול האחרון', 'lastServiceKm', v.lastServiceKm, { type: 'number', attrs: 'min="0"' })}
      ${fld('הערות', 'notes', v.notes, { type: 'textarea', full: true })}
    </div>`,

      confirmBox('מחיקת רכב', `למחוק את רכב ${esc(v.number)} ואת כל ההיסטוריה שלו?`, () => {
        App.closeDrawer();
        S.data.faults.filter(f => f.vehicleId === v.id).forEach(f => Store.remove('faults', f.id));
        S.data.maint.filter(m => m.vehicleId === v.id).forEach(m => Store.remove('maint', m.id));
        Store.remove('vehicles', v.id, `נמחק רכב: ${typeName(v.typeId)} ${v.number}`); toast('הרכב נמחק');
      }, 'מחיקה');
    }),
    onSubmit: (fd, form) => {
      const g = getter(fd); const number = isNew ? g('number') : v.number;
      let bad = false;
      if (!number) { fieldErr(form, 'number', 'שדה חובה'); bad = true; }
      else if (isNew && Store.get('vehicles', safeId(number))) { fieldErr(form, 'number', 'רכב עם המספר הזה כבר קיים'); bad = true; }

/* =========================================================
   משימות נסיעה – בקשה ← אישור קצין רכב ← שבצ״ק
   task = { due (תאריך), time (שעת יציאה), title (מהות המשימה), dest (לאן),
            driverId, driverName, vehicleId, vehicleLabel, commander (מפקד נסיעה), desc (הערות),
            status: בקשה | מאושרת | בביצוע | הושלמה | נדחתה,
            requestedBy (email), requestedByName, unitId, approvedBy, approvedAt, rejectReason,
            createdAt, createdBy, doneAt, history:[{at,by,text}] }
   כולם רואים את כל המשימות. משתמש רגיל יכול רק להגיש בקשה.
   רק קצין רכב מאשר / דוחה / משבץ נהג ורכב / משנה סטטוס.
   ========================================================= */
const TASK_ST = ['מאושרת', 'בביצוע', 'הושלמה'];
const ST_REQ = 'בקשה', ST_REJ = 'נדחתה';
S.f.tasks = { q: '', status: 'plan' };

const myEmail = () => (S.user?.email || 'me').toLowerCase();
const tStatus = t => t.status === 'פתוחה' ? 'מאושרת' : (t.status || 'מאושרת');   /* נתונים ישנים */
const isReq = t => tStatus(t) === ST_REQ;
const isPlanned = t => ['מאושרת', 'בביצוע'].includes(tStatus(t));
const taskLate = t => isPlanned(t) && t.due && daysUntil(t.due) < 0;
const visibleTasks = () => S.data.tasks;
const pendingCount = () => S.data.tasks.filter(isReq).length;
const tDriver = t => (t.driverId && Store.get('drivers', t.driverId)) || null;
const tVehicle = t => (t.vehicleId && Store.get('vehicles', t.vehicleId)) || null;
const driverLabel = t => tDriver(t)?.name || t.driverName || '';
const vehicleLabel = t => { const v = tVehicle(t); return v ? `${typeName(v.typeId)} ${v.number}` : (t.vehicleLabel || ''); };
/* שמות למפקד נסיעה: משתמשים + נהגים */
const commanderNames = () => [...new Set([...S.data.users.map(u => u.name).filter(Boolean), ...S.data.drivers.map(d => d.name)])].sort((a, b) => a.localeCompare(b, 'he'));

function stBadge(t) {
  const s = tStatus(t);
  const cls = { [ST_REQ]: 'warn', 'מאושרת': 'info', 'בביצוע': 'info', 'הושלמה': 'ok', [ST_REJ]: 'bad' }[s] || 'muted';
  return `<span class="badge ${cls}">${esc(s === ST_REQ ? 'ממתינה לאישור' : s)}</span>`;
}
function dayLabel(s) {
  if (!s) return 'ללא תאריך';
  const n = daysUntil(s);
  const base = `${dayName(s)} ${fmtDate(s)}`;
  return n === 0 ? 'היום · ' + base : n === 1 ? 'מחר · ' + base : n === -1 ? 'אתמול · ' + base : base;
}

/* בדיקות שיבוץ – לפי כשירות, זמינות, כרך ז׳ 3.08 */
function missionWarnings(t) {
  const w = [], d = tDriver(t), v = tVehicle(t);
  if (!t.driverId) w.push('לא שובץ נהג');
  if (!t.vehicleId) w.push('לא שובץ רכב');
  if (!t.commander) w.push('לא הוגדר מפקד נסיעה');
  if (d) {
    const st = driverStatus(d);
    if (st.lv === 'bad') w.push(`הנהג ${d.name}: ${st.label}`);
    if (v && !qualified(d, v.typeId)) w.push(`הנהג ${d.name} לא מוסמך (נגררת בתוקף) על ${typeName(v.typeId)}`);
    if ((d.availability || 'ביחידה') !== 'ביחידה') w.push(`הנהג ${d.name} מסומן "${d.availability}"`);
  }
  if (v && !vehicleUsable(v)) w.push(`הרכב ${v.number}: ${vehicleStatus(v).label}`);
  if (t.time && (t.time >= '23:00' || t.time < '06:00')) w.push('יציאה בין 23:00 ל-06:00 – נדרש אישור סא״ל ומעלה (כרך ז׳ הוראה 3.08)');
  if (t.commander && d && t.commander === d.name) w.push('הנהג מוגדר גם כמפקד הנסיעה – לא מותר באימון/פע״מ או ב-6 נוסעים ומעלה (3.08)');
  const same = S.data.tasks.filter(x => x.id !== t.id && x.due === t.due && isPlanned(x));
  if (t.driverId && same.some(x => x.driverId === t.driverId)) w.push('לנהג יש משימה נוספת באותו יום');
  if (t.vehicleId && same.some(x => x.vehicleId === t.vehicleId)) w.push('הרכב משובץ למשימה נוספת באותו יום');
  return w;
}

function tasksFiltered(ignoreStatus) {
  const f = S.f.tasks, q = f.q.trim().toLowerCase(), T = todayISO();
  return visibleTasks().filter(t => {
    if (q && !`${t.title} ${t.dest || ''} ${t.desc || ''} ${driverLabel(t)} ${t.commander || ''} ${t.requestedByName || ''}`.toLowerCase().includes(q)) return false;
    if (!ignoreStatus) {
      const s = tStatus(t);
      if (f.status === 'req' && s !== ST_REQ) return false;
      if (f.status === 'plan' && !(isPlanned(t) && (!t.due || t.due >= addDays(T, -1)))) return false;
      if (f.status === 'mine' && String(t.requestedBy || '').toLowerCase() !== myEmail()) return false;
      if (f.status === 'done' && s !== 'הושלמה') return false;
      if (f.status === 'rej' && s !== ST_REJ) return false;
    }
    return true;
  }).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || String(a.time || '99').localeCompare(String(b.time || '99')));
}

VIEWS.tasks = {
  page() {
    const f = S.f.tasks, base = tasksFiltered(true), admin = isAdmin(), T = todayISO();
    const seg = [
      ['req', admin ? 'בקשות לאישור' : 'ממתינות לאישור', base.filter(isReq).length],
      ['plan', 'מתוכננות', base.filter(t => isPlanned(t) && (!t.due || t.due >= addDays(T, -1))).length],
      ['mine', 'הבקשות שלי', base.filter(t => String(t.requestedBy || '').toLowerCase() === myEmail()).length],
      ['done', 'הושלמו', base.filter(t => tStatus(t) === 'הושלמה').length],
      ['rej', 'נדחו', base.filter(t => tStatus(t) === ST_REJ).length],
      ['all', 'הכל', base.length],
    ];
    return `
      <div class="phead"><div><h1>משימות נסיעה</h1><p class="sub">${admin ? 'בקשות, אישור ושיבוץ נהג ורכב' : 'כל המשימות · אפשר להגיש בקשה למשימה'}</p></div>
        <div class="acts">${admin ? `<button class="btn primary" data-act="add-task">${ic('plus')}משימה חדשה</button>` : `<button class="btn primary" data-act="add-task">${ic('plus')}בקשה למשימה</button>`}
        <button class="btn" data-act="report">${ic('download')}שבצ״ק PDF</button></div></div>
      ${admin && pendingCount() && f.status !== 'req' ? `<div class="reasons warn" style="margin-bottom:14px;cursor:pointer" data-act="setf" data-k="tasks.status" data-v="req">${ic('alert')}<span><b>${pendingCount()} בקשות</b> ממתינות לאישור שלך – לחץ כאן</span></div>` : ''}
      <div class="toolbar">
        <div class="tb-search">${ic('search', 'sm')}<input class="input" type="search" placeholder="חיפוש: מהות, יעד, נהג, מפקד" value="${esc(f.q)}" data-filter="tasks.q"></div>
        <div class="seg">${seg.map(([v, l, n]) => `<button class="${f.status === v ? 'on' : ''}" data-act="setf" data-k="tasks.status" data-v="${v}">${l} <span class="n">${n}</span></button>`).join('')}</div>
      </div>
      <div id="list">${this.list()}</div>`;
  },
  list() {
    const rows = tasksFiltered();
    if (!rows.length) return `<div class="card"><div class="empty-state">${ic('check')}<b>אין משימות להצגה</b>${S.f.tasks.status === 'req' ? 'אין בקשות שממתינות לאישור' : ''}</div></div>`;
    const groups = []; let cur = null;
    rows.forEach(t => { if (!cur || cur.day !== (t.due || '')) { cur = { day: t.due || '', items: [] }; groups.push(cur); } cur.items.push(t); });
    return groups.map(g => `<div class="tday"><h3 class="${g.day && daysUntil(g.day) === 0 ? 'today' : ''}">${esc(dayLabel(g.day))} <small>${g.items.length} משימות</small></h3><div class="tasks">${g.items.map(taskCard).join('')}</div></div>`).join('');
  },
};
function taskCard(t) {
  const admin = isAdmin(), s = tStatus(t);
  const warn = admin && (isReq(t) || isPlanned(t)) ? missionWarnings(t) : [];
  return `<div class="tcard m ${s === 'הושלמה' ? 'done' : s === ST_REJ ? 'rej' : isReq(t) ? 'req' : taskLate(t) ? 'late' : ''}">
    <div class="ttime">${esc(t.time || '--:--')}<small>יציאה</small></div>
    <div class="tmain" data-act="open-task" data-id="${esc(t.id)}">
      <div class="tt1"><b>${esc(t.title)}</b>${t.dest ? `<span class="tdest">${ic('truck', 'sm')}${esc(t.dest)}</span>` : ''}${stBadge(t)}</div>
      <div class="tmeta">
        <span>${ic('users', 'sm')}נהג: <b>${esc(driverLabel(t) || '—')}</b></span>
        <span>${ic('truck', 'sm')}רכב: <b>${esc(vehicleLabel(t) || '—')}</b></span>
        <span>${ic('shield', 'sm')}מפקד: <b>${esc(t.commander || '—')}</b></span>
      </div>
      ${t.desc ? `<div class="tdesc">${esc(t.desc)}</div>` : ''}
      ${isReq(t) ? `<div class="treq">ביקש: ${esc(t.requestedByName || '')}${t.unitId ? ' · ' + esc(unitName(t.unitId)) : ''} · ${fmtDateTime(t.createdAt)}</div>` : ''}
      ${s === ST_REJ && t.rejectReason ? `<div class="treq t-bad">סיבת דחייה: ${esc(t.rejectReason)}</div>` : ''}
      ${warn.length ? `<div class="twarn">${ic('alert', 'sm')}${esc(warn.slice(0, 2).join(' · '))}${warn.length > 2 ? ` ועוד ${warn.length - 2}` : ''}</div>` : ''}
    </div>
    ${admin && isReq(t) ? `<div class="tacts"><button class="btn sm primary" data-act="task-approve" data-id="${esc(t.id)}">${ic('check', 'sm')}אישור ושיבוץ</button><button class="btn sm danger" data-act="task-reject" data-id="${esc(t.id)}">דחייה</button></div>`
      : admin && isPlanned(t) ? `<div class="tacts"><button class="btn sm" data-act="task-done" data-id="${esc(t.id)}">${ic('check', 'sm')}בוצעה</button></div>` : ''}
  </div>`;
}

/* כרטיס משימה */
function taskView(t) {
  const admin = isAdmin(), s = tStatus(t);
  const hist = [...(t.history || [])].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const warn = (isReq(t) || isPlanned(t)) ? missionWarnings(t) : [];
  modal({
    title: t.title,
    foot: admin ? `<button type="button" class="btn start" id="tEdit">${ic('edit', 'sm')}עריכה</button>${isReq(t) ? `<button type="button" class="btn danger" id="tRej">דחייה</button><button type="button" class="btn primary" id="tApp">${ic('check', 'sm')}אישור ושיבוץ</button>` : ''}` : '',
    body: `<div class="tview">
      <div class="tvs">${stBadge(t)}<span class="pill muted">${esc(dayLabel(t.due))}${t.time ? ' · ' + esc(t.time) : ''}</span></div>
      <div class="kv2" style="margin:14px 0">
        <div><div class="k">מהות המשימה</div><div class="v">${esc(t.title)}</div></div>
        <div><div class="k">לאן</div><div class="v">${esc(t.dest || '—')}</div></div>
        <div><div class="k">שעת יציאה</div><div class="v">${esc(t.time || '—')}</div></div>
        <div><div class="k">תאריך</div><div class="v">${fmtDate(t.due)}</div></div>
        <div><div class="k">נהג</div><div class="v">${esc(driverLabel(t) || '—')}</div></div>
        <div><div class="k">רכב</div><div class="v">${esc(vehicleLabel(t) || '—')}</div></div>
        <div><div class="k">מפקד נסיעה</div><div class="v">${esc(t.commander || '—')}</div></div>
        <div><div class="k">ביקש</div><div class="v">${esc(t.requestedByName || t.createdBy || '—')}</div></div>
        ${t.approvedBy ? `<div><div class="k">אישר</div><div class="v">${esc(t.approvedBy)} · ${fmtDateTime(t.approvedAt)}</div></div>` : ''}
        ${t.desc ? `<div style="grid-column:1/-1"><div class="k">הערות</div><div class="v" style="white-space:pre-wrap">${esc(t.desc)}</div></div>` : ''}
        ${s === ST_REJ ? `<div style="grid-column:1/-1"><div class="k">סיבת דחייה</div><div class="v t-bad">${esc(t.rejectReason || '—')}</div></div>` : ''}
      </div>
      ${warn.length && admin ? `<div class="reasons warn">${ic('alert')}<ul>${warn.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${admin && !isReq(t) && s !== ST_REJ ? `<div class="fld" style="margin-top:12px"><label>עדכון סטטוס</label><div class="seg" id="tSt">${TASK_ST.map(x => `<button type="button" class="${s === x ? 'on' : ''}" data-st="${x}">${x}</button>`).join('')}</div></div>` : ''}
      ${hist.length ? `<div class="sec" style="margin-top:14px"><h3>${ic('history', 'sm')}היסטוריה</h3><div class="tl">${hist.map(h => `<div class="it"><span class="d">${fmtDateTime(h.at)}</span><span style="flex:1">${esc(h.text)}</span><small class="t-muted">${esc(h.by || '')}</small></div>`).join('')}</div></div>` : ''}
    </div>`,
    onMount: f => {
      f.querySelector('#tEdit')?.addEventListener('click', () => taskForm(t));
      f.querySelector('#tApp')?.addEventListener('click', () => taskForm(t, {}, 'approve'));
      f.querySelector('#tRej')?.addEventListener('click', () => rejectForm(t));
      f.querySelectorAll('#tSt [data-st]').forEach(b => b.onclick = () => { setTaskStatus(t, b.dataset.st); closeModal(); });
    },
  });
}
const histItem = text => ({ at: new Date().toISOString(), by: S.user?.name || '', text });
function setTaskStatus(t, st) {
  if (tStatus(t) === st) return;
  Store.put('tasks', { ...t, status: st, doneAt: st === 'הושלמה' ? new Date().toISOString() : '', history: [...(t.history || []), histItem(`סטטוס: ${tStatus(t)} ← ${st}`)] }, `משימה "${t.title}": ${st}`);
  toast(st === 'הושלמה' ? 'המשימה סומנה כבוצעה' : 'הסטטוס עודכן');
}
function rejectForm(t) {
  modal({
    title: 'דחיית בקשה – ' + t.title, size: 'sm', submit: 'דחייה', danger: true,
    body: `<div class="form">${fld('סיבה', 'reason', '', { full: true, req: true, ph: 'למשל: אין רכב פנוי באותו יום' })}</div>`,
    onSubmit: (fd, form) => {
      const r = getter(fd)('reason'); if (!r) { fieldErr(form, 'reason', 'יש לציין סיבה'); return false; }
      Store.put('tasks', { ...t, status: ST_REJ, rejectReason: r, history: [...(t.history || []), histItem('נדחתה: ' + r)] }, `נדחתה בקשה למשימה: ${t.title} – ${r}`);
      toast('הבקשה נדחתה');
    },
  });
}

/* טופס: בקשה (משתמש רגיל) / משימה חדשה או עריכה (קצין רכב) / אישור ושיבוץ */
function taskForm(t, preset = {}, mode) {
  const admin = isAdmin(), isNew = !t;
  t = t || { status: admin ? 'מאושרת' : ST_REQ, due: addDays(todayISO(), 1), ...preset };
  const approving = mode === 'approve';
  const drivers = scoped(S.data.drivers).sort((a, b) => (driverUsable(a) ? 0 : 1) - (driverUsable(b) ? 0 : 1) || byName(a, b));
  const vehicles = scoped(S.data.vehicles).sort((a, b) => typeName(a.typeId).localeCompare(typeName(b.typeId), 'he') || String(a.number).localeCompare(String(b.number)));
  const dOpt = d => { const st = driverStatus(d); return opt(d.id, `${d.name} · ${unitName(d.unitId)}${st.lv === 'bad' ? ' · ' + st.label : ''}${(d.availability || 'ביחידה') !== 'ביחידה' ? ' · ' + d.availability : ''}`, t.driverId); };
  const vOpt = v => opt(v.id, `${typeName(v.typeId)} ${v.number} · ${unitName(v.unitId)}${vehicleUsable(v) ? '' : ' · ' + vehicleStatus(v).label}`, t.vehicleId);
  const title = approving ? 'אישור ושיבוץ – ' + t.title : isNew ? (admin ? 'משימת נסיעה חדשה' : 'בקשה למשימת נסיעה') : 'עריכת משימה';
  modal({
    title, submit: approving ? 'אישור המשימה' : isNew ? (admin ? 'שמירה' : 'שליחת בקשה') : 'שמירה',
    foot: !isNew && admin && !approving ? `<button type="button" class="btn danger start" id="tDel">${ic('trash', 'sm')}מחיקה</button>` : '',
    body: `<div class="form">
      ${!admin && isNew ? `<div class="full reasons info">${ic('info')}<span>הבקשה תישלח לקצין הרכב לאישור. אחרי האישור היא תופיע בשבצ״ק.</span></div>` : ''}
      ${fld('מהות המשימה', 'title', t.title, { full: true, req: true, ph: 'למשל: הבאת ציוד מהימ״ח' })}
      ${fld('לאן', 'dest', t.dest, { req: true, ph: 'יעד הנסיעה' })}
      ${fld('תאריך', 'due', t.due, { type: 'date', req: true })}
      ${fld('שעת יציאה', 'time', t.time, { type: 'time', req: true })}
      <div class="fld" data-f="commander"><label>מפקד נסיעה${admin ? ' <i>*</i>' : ''}</label><input class="input" name="commander" list="cmdList" value="${esc(t.commander || '')}" placeholder="שם המפקד"><datalist id="cmdList">${commanderNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
      ${admin ? `<h4>שיבוץ</h4>
      <div class="fld" data-f="driverId"><label>נהג <i>*</i></label><select class="select" name="driverId">${opt('', 'בחר נהג…', t.driverId)}${drivers.map(dOpt).join('')}</select></div>
      <div class="fld" data-f="vehicleId"><label>רכב <i>*</i></label><select class="select" name="vehicleId">${opt('', 'בחר רכב…', t.vehicleId)}${vehicles.map(vOpt).join('')}</select></div>
      <div class="full" id="mWarn"></div>` : `
      <div class="fld"><label>נהג מבוקש (לא חובה)</label><select class="select" name="driverId">${opt('', '—', t.driverId)}${drivers.map(dOpt).join('')}</select></div>
      <div class="fld"><label>רכב מבוקש (לא חובה)</label><select class="select" name="vehicleId">${opt('', '—', t.vehicleId)}${vehicles.map(vOpt).join('')}</select></div>`}
      ${fld('הערות', 'desc', t.desc, { type: 'textarea', full: true, ph: 'מספר נוסעים, ציוד, נקודות עצירה…' })}
    </div>`,
    onMount: form => {
      form.querySelector('#tDel')?.addEventListener('click', () => confirmBox('מחיקת משימה', `למחוק את "${esc(t.title)}"?`, () => { Store.remove('tasks', t.id, `נמחקה משימה: ${t.title}`); toast('המשימה נמחקה'); }, 'מחיקה'));
      const box = form.querySelector('#mWarn');
      if (box) {
        const upd = () => {
          const g = getter(new FormData(form));
          const w = missionWarnings({ ...t, due: g('due'), time: g('time'), driverId: g('driverId'), vehicleId: g('vehicleId'), commander: g('commander') });
          box.innerHTML = w.length ? `<div class="reasons warn">${ic('alert')}<ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : `<div class="reasons info">${ic('check')}<span>השיבוץ תקין – הנהג כשיר על הרכב, הרכב כשיר</span></div>`;
        };
        form.addEventListener('change', upd); form.addEventListener('input', e => { if (e.target.name === 'commander' || e.target.name === 'time') upd(); }); upd();
      }
    },
    onSubmit: (fd, form) => {
      const g = getter(fd);
      let bad = false;
      if (!g('title')) { fieldErr(form, 'title', 'שדה חובה'); bad = true; }
      if (!g('dest')) { fieldErr(form, 'dest', 'שדה חובה'); bad = true; }
      if (!g('due')) { fieldErr(form, 'due', 'שדה חובה'); bad = true; }
      if (!g('time')) { fieldErr(form, 'time', 'שדה חובה'); bad = true; }
      if (admin && !g('commander')) { fieldErr(form, 'commander', 'יש להגדיר מפקד נסיעה'); bad = true; }
      if (admin && !g('driverId')) { fieldErr(form, 'driverId', 'יש לשבץ נהג'); bad = true; }
      if (admin && !g('vehicleId')) { fieldErr(form, 'vehicleId', 'יש לשבץ רכב'); bad = true; }
      if (bad) { form.querySelector('.fld.err')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return false; }
      const d = Store.get('drivers', g('driverId')), v = Store.get('vehicles', g('vehicleId'));
      const now = new Date().toISOString(), me = S.user?.name || '';
      const obj = {
        ...t, title: g('title'), dest: g('dest'), due: g('due'), time: g('time'), commander: g('commander'), desc: g('desc'),
        driverId: g('driverId'), driverName: d?.name || '', vehicleId: g('vehicleId'), vehicleLabel: v ? `${typeName(v.typeId)} ${v.number}` : '',
        createdAt: t.createdAt || now, createdBy: t.createdBy || me,
        requestedBy: t.requestedBy || myEmail(), requestedByName: t.requestedByName || me, unitId: t.unitId || S.user?.unitId || d?.unitId || '',
      };
      if (!admin) { obj.status = ST_REQ; obj.history = [histItem('הוגשה בקשה')]; }
      else if (approving || isReq(t)) { obj.status = 'מאושרת'; obj.approvedBy = me; obj.approvedAt = now; obj.history = [...(t.history || []), histItem(`אושרה ושובצה: ${d?.name} · ${obj.vehicleLabel}`)]; }
      else { obj.status = tStatus(t); if (isNew) { obj.approvedBy = me; obj.approvedAt = now; } obj.history = [...(t.history || []), histItem(isNew ? `נוצרה: ${d?.name} · ${obj.vehicleLabel}` : 'עודכנה')]; }
      if (!admin) { Store.put('tasks', obj, `בקשה למשימה: ${obj.title} → ${obj.dest} (${fmtDate(obj.due)} ${obj.time})`); toast('הבקשה נשלחה לקצין הרכב'); return; }
      const w = missionWarnings(obj);
      const save = () => { Store.put('tasks', obj, `${approving ? 'אושרה' : isNew ? 'נוצרה' : 'עודכנה'} משימה: ${obj.title} → ${obj.dest} · ${obj.driverName}`); closeModal(); toast(approving ? 'המשימה אושרה ותופיע בשבצ״ק' : 'נשמר'); };
      const serious = w.filter(x => /לא מוסמך|ממתין|פגה|לא כשיר|מושעה|מושבת|23:00/.test(x));
      if (serious.length) { setTimeout(() => confirmBox('לשמור למרות האזהרות?', `<ul style="margin:0;padding-inline-start:18px">${serious.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, save, 'שמירה בכל זאת', false), 0); return true; }
      save(); return true;
    },
  });
}

/* מקטע משימות בכרטיס נהג / רכב */

const H2P_SRC = ['html2pdf.bundle.min.js', 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js'];
async function loadH2P() {
  if (window.html2pdf) return window.html2pdf;
  for (const src of H2P_SRC) { try { await loadScript(src); if (window.html2pdf) return window.html2pdf; } catch (e) { /* next */ } }
  throw new Error('לא ניתן לטעון את רכיב ה-PDF – בדוק חיבור לאינטרנט');
}
const HEB_DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

function rpVehicles() {

  const ord = { bad: 0, info: 1, warn: 2, ok: 3 };

function rpDoh1(scope) {
  const inScope = d => scope === 'all' ? true : (u => !!u && unitKind(u) === 'platoon')(S.data.units.find(u => u.id === d.unitId));
  const D = scoped(S.data.drivers).filter(inScope);

  const counts = avails().map(a => [a, D.filter(d => av(d) === a).length]).filter(([, n]) => n);

      ${xs.map((d, i) => { const st = driverStatus(d); return `<tr${av(d) !== 'ביחידה' ? ' class="away"' : ''}><td class="c">${i + 1}</td><td><b>${esc(d.name)}</b></td><td class="c ltr">${esc(d.pn)}</td><td>${esc(d.rank || '')}</td><td class="c ltr">${esc(d.phone || '')}</td><td class="c"><b>${esc(av(d))}</b></td><td class="c"><span class="st ${st.lv}">${esc(st.label)}</span></td><td class="sm">${esc(ngrTypes(d).filter(id => qualified(d, id)).map(typeName).join(', ') || '—')}</td></tr>`; }).join('')}
      </tbody></table>`;
  };
  return `<section class="rsec">
    <div class="rsec-h"><h2>דוח 1 – ${scope === 'all' ? 'נהגי הגדוד' : 'מחלקת רכב'}</h2><span>${fullDate(todayISO())}</span></div>
    <div class="rsum"><div><b>${D.length}</b><span>סה״כ</span></div>${counts.map(([a, n]) => `<div class="${a === 'ביחידה' ? 'ok' : ''}"><b>${n}</b><span>${esc(a)}</span></div>`).join('')}<div class="${fitHere < here.length ? 'warn' : 'ok'}"><b>${fitHere}</b><span>כשירים ביחידה</span></div></div>
    ${units.map(block).join('') || `<div class="rempty">${scope === 'all' ? 'אין נהגים' : 'לא הוגדרה מחלקת רכב (הגדרות ← סוללות ומחלקת רכב) או שאין בה נהגים'}</div>`}
  </section>`;
}
function reportHTML(o) {
  const parts = [];
  if (o.tasks) parts.push(rpTasks(o.day));
  if (o.vehicles) parts.push(rpVehicles());
  if (o.doh1) parts.push(rpDoh1(o.scope));

function readOpts(form) {
  const fd = new FormData(form), g = getter(fd);
  const o = { tasks: !!fd.get('tasks'), vehicles: !!fd.get('vehicles'), doh1: !!fd.get('doh1'), day: g('day') || addDays(todayISO(), 1), scope: g('scope') };
  form.querySelectorAll('.fld.err').forEach(f => { f.classList.remove('err'); f.querySelector('.msg')?.remove(); });
  if (!o.tasks && !o.vehicles && !o.doh1) { fieldErr(form, 'parts', 'יש לבחור לפחות חלק אחד'); return null; }
  return o;
}
const reportName = o => `doch_${o.tasks ? o.day : todayISO()}.pdf`;
async function makePDF(o) {
  toast('מכין PDF…');
  let lib;
  try { lib = await loadH2P(); } catch (e) { toast(e.message + ' – נפתחת הדפסה במקום', 'bad'); printReport(o); return; }
  const host = document.createElement('div');
  host.className = 'rp-host'; host.innerHTML = reportHTML(o);
  document.body.appendChild(host);
  /* html2canvas מצייר אות-אות (letter-spacing) כדי שהרווחים בעברית יישמרו; בציור אות-אות
     הסוגריים לא מתהפכים אוטומטית – לכן מחליפים אותם ידנית בטקסט עברי */
  const tw = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
  const swap = { '(': ')', ')': '(', '[': ']', ']': '[', '<': '>', '>': '<' };
  for (let n = tw.nextNode(); n; n = tw.nextNode()) if (/[\u0590-\u05FF]/.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/[()[\]<>]/g, c => swap[c]);
  try {
    await lib().set({
      margin: [8, 8, 10, 8], filename: reportName(o),
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 820, scrollX: 0, scrollY: 0, onclone: doc => { doc.documentElement.dir = 'ltr'; doc.body.classList.add('pdfmode'); } },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], before: '.pbreak', avoid: ['tr', '.rsum', '.rsec-h', 'h3'] },
    }).from(host.querySelector('.report')).save();
    toast('ה-PDF ירד');
    Store.log('הופק דוח PDF: ' + [o.tasks && 'שבצ״ק ' + fmtDate(o.day), o.vehicles && 'מצבת רכבים', o.doh1 && 'דוח 1'].filter(Boolean).join(', '));
  } catch (e) { toast('הפקת ה-PDF נכשלה: ' + e.message, 'bad'); }
  host.remove();
}
function printReport(o) {
  let host = $('#printArea');
  if (!host) { host = document.createElement('div'); host.id = 'printArea'; document.body.appendChild(host); }
  host.innerHTML = reportHTML(o);
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); host.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { try { window.print(); } catch (e) { done(); } }, 120);
}
ACT.report = () => reportDialog();

    save: (g, err) => {

      if (S.data.units.some(u => u.name === name)) return err('כבר קיים שם כזה');
      const u = Store.put('units', { id: 'u' + uid(), name, kind: g('_k') || 'battery', order: S.data.units.length + 1 }, `נוספה ${UNIT_KIND[g('_k')] || 'סוללה'}: ${name}`);
      return { value: u.id, label: name };
    },
  },
  rank: { title: 'דרגה חדשה', list: 'rank', ph: 'למשל: רנ״ג' },
  service: { title: 'סוג שירות חדש', list: 'service', ph: 'למשל: שירות לאומי' },
  avail: { title: 'מצב זמינות חדש', list: 'avail', ph: 'למשל: בהשתלמות' },
  user: {
    title: 'משתמש חדש',
    body: () => `<input class="input" name="_n" placeholder="שם ותפקיד">
      <input class="input" name="_e" type="email" dir="ltr" placeholder="כתובת Gmail">
      <select class="select" name="_r">${opt('company', 'מפקד סוללה', 'company')}${opt('hq', 'מפקדת גדוד – צפייה', '')}${opt('admin', 'קצין רכב – ניהול מלא', '')}</select>
      <select class="select" name="_u">${opt('', 'סוללה…', '')}${unitsSorted().map(u => opt(u.id, u.name, '')).join('')}</select>`,
    save: (g, err) => {
      const email = g('_e').toLowerCase(), role = g('_r');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('כתובת מייל לא תקינה');
      if (S.data.users.some(u => u.id === email)) return err('המשתמש כבר קיים');
      if (role === 'company' && !g('_u')) return err('יש לבחור סוללה למפקד סוללה');
      const name = g('_n') || email;
      Store.put('users', { id: email, name, role, unitId: role === 'company' ? g('_u') : '' }, `נוסף משתמש: ${email} (${ROLE_LABEL[role]})`);
      return { value: email, label: name + ' · ' + ROLE_LABEL[role] };
    },
  },
};
/* ערך בהגדרות (דרגה / שירות / זמינות) */
function saveListValue(key, g, err) {
  const v = g('_n'); if (!v) return err('יש להזין ערך');
  const all = { rank: ranks, service: services, avail: avails }[key]();
  if (all.includes(v)) return { value: v, label: v };
  const lists = { ...(S.settings.lists || {}) }; lists[key] = [...(lists[key] || []), v];
  Store.saveSettings({ ...S.settings, lists });
  return { value: v, label: v };
}

function openAddBox(anchor, kind, onDone) {
  const A = ADDERS[kind]; if (!A) return;
  anchor.parentElement.querySelector('.addbox')?.remove();
  const box = document.createElement('div');
  box.className = 'addbox';
  box.innerHTML = `<div class="ab-t">${ic('plus', 'sm')}${esc(A.title)}</div>
    <div class="ab-f">${A.body ? A.body() : `<input class="input" name="_n" placeholder="${esc(A.ph || '')}">`}</div>
    <div class="ab-e"></div>
    <div class="ab-b"><button type="button" class="btn sm primary" data-ab="ok">${ic('check', 'sm')}הוספה</button><button type="button" class="btn sm" data-ab="no">ביטול</button></div>`;
  anchor.insertAdjacentElement('afterend', box);
  const roleSel = box.querySelector('[name=_r]'), unitSel = box.querySelector('[name=_u]');
  if (roleSel && unitSel) { const f = () => { unitSel.hidden = roleSel.value !== 'company'; }; roleSel.onchange = f; f(); }
  const first = box.querySelector('input'); setTimeout(() => first?.focus(), 30);
  const close = () => box.remove();
  const ok = () => {
    const g = k => (box.querySelector(`[name="${k}"]`)?.value || '').trim();
    let msg = '';
    const err = m => { msg = m; return null; };
    const r = A.list ? saveListValue(A.list, g, err) : A.save(g, err);
    if (!r) { box.querySelector('.ab-e').textContent = msg; return; }
    close(); onDone(r); toast('נוסף: ' + r.label.split(' · ')[0]);
  };
  box.querySelector('[data-ab=ok]').onclick = ok;
  box.querySelector('[data-ab=no]').onclick = close;
  box.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } if (e.key === 'Escape') { e.stopPropagation(); close(); } });
}

/* select עם data-add: בחירה ב"+ הוספה…" פותחת את שורת ההוספה */
document.addEventListener('focusin', e => { const s = e.target; if (s.tagName === 'SELECT' && s.dataset.add && s.value !== ADD_V) s.dataset.prev = s.value; });
document.addEventListener('change', e => {
  const s = e.target;
  if (s.tagName !== 'SELECT' || !s.dataset.add || s.value !== ADD_V) return;
  e.stopImmediatePropagation();
  s.value = s.dataset.prev || '';
  openAddBox(s, s.dataset.add, r => {
    const o = document.createElement('option'); o.value = r.value; o.textContent = r.label;
    const addO = s.querySelector('[data-addopt]');
    const grp = s.querySelector('optgroup:last-of-type');
    if (s.dataset.add === 'unit' && grp) grp.appendChild(o); else s.insertBefore(o, addO);
    s.value = r.value; s.dataset.prev = r.value;
    s.dispatchEvent(new Event('change', { bubbles: true }));
  });
}, true);

/* =========================================================

const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const norm = s => String(s ?? '').replace(/["״׳'\s.:\-–]/g, '');
/* recognised column names (first = the one used in the template) */
const DKEYS = {
  pn: ['מספר אישי', 'מס אישי', 'מ"א', 'מס׳ אישי'], name: ['שם מלא', 'שם', 'שם ומשפחה'], rank: ['דרגה'],
  unit: ['סוללה', 'פלוגה', 'שיוך', 'יחידה', 'מסגרת'], phone: ['טלפון', 'נייד', 'פלאפון'], service: ['סוג שירות'], availability: ['זמינות'],
  civilLicenseNo: ['מספר רישיון אזרחי', 'מספר רישיון'], civilGrade: ['דרגת רישיון אזרחי', 'דרגת רישיון', 'סוג רישיון'], civilExp: ['תוקף רישיון אזרחי', 'תוקף רישיון'],
  milHas: ['רישיון צבאי'], milLicenseNo: ['מספר רישיון צבאי'], milExp: ['תוקף רישיון צבאי'],
  medicalExp: ['תוקף כשירות רפואית', 'כשירות רפואית', 'תוקף רפואי'], refAll: ['תאריך ריענון אחרון', 'ריענון אחרון', 'תאריך ריענון'],
  permits: ['היתרים', 'היתרי רכב'], notes: ['הערות'],
};
const VKEYS = {
  number: ['מספר רכב', 'מס רכב', 'מספר צבאי', 'צ'], type: ['סוג רכב', 'סוג'], unit: ['סוללה', 'פלוגה', 'שיוך', 'יחידה', 'מסגרת'],
  km: ['ק״מ', 'ק"מ', 'קילומטראז'], lastServiceDate: ['תאריך טיפול אחרון', 'טיפול אחרון'], lastServiceKm: ['ק״מ בטיפול אחרון'],
  location: ['מיקום'], notes: ['הערות'],
};
const keyOf = (map, h) => { const n = norm(h); if (!n) return null; for (const [k, names] of Object.entries(map)) if (names.some(x => norm(x) === n)) return k; return null; };
const blank = v => v === '' || v == null || v === 0 || String(v).trim() === '0';
const yesNo = v => { const s = norm(v).toLowerCase(); if (['יש', 'כן', 'v', 'x', 'yes', '1', 'true'].includes(s)) return true; if (['אין', 'לא', 'no', 'false'].includes(s)) return false; return null; };

const IO = {
  async lib() {
    if (window.XLSX) return window.XLSX;
    try { await loadScript('xlsx.full.min.js'); } catch (e) { await loadScript(XLSX_URL); }
    return window.XLSX;
  },
  wb(X, sheets) {
    const wb = X.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    for (const [name, aoa] of sheets) {
      const ws = X.utils.aoa_to_sheet(aoa);
      ws['!cols'] = aoa[0].map((h, i) => ({ wch: Math.max(10, ...aoa.slice(0, 50).map(r => String(r[i] ?? '').length + 2)) }));
      X.utils.book_append_sheet(wb, ws, name);
    }
    return wb;
  },
  save(X, wb, name) { download(name, new Blob([X.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); },
  dHead() { return ['מספר אישי', 'שם מלא', 'דרגה', 'סוללה', 'טלפון', 'סוג שירות', 'זמינות', 'מספר רישיון אזרחי', 'דרגת רישיון אזרחי', 'תוקף רישיון אזרחי', ...typesSorted().map(t => 'ריענון: ' + t.name), 'הערות']; },
  vHead() { return ['מספר רכב', 'סוג רכב', 'סוללה', 'ק״מ', 'תאריך טיפול אחרון', 'ק״מ בטיפול אחרון', 'מיקום', 'הערות']; },

  async template() {
    const X = await this.lib().catch(() => null); if (!X) return toast('לא ניתן לטעון את רכיב האקסל – בדוק חיבור לאינטרנט', 'bad');
    const tn = typesSorted(), un = unitsSorted().map(u => u.name);
    const ex = d => fmtDate(addDays(todayISO(), d)).replace(/\/(\d\d)$/, '/20$1');
    const row = ['1234567', 'ישראל ישראלי', 'סמ״ר', un[0] || 'סוללה א׳', '050-1234567', 'מילואים', 'ביחידה', '7654321', 'C1', ex(900), ...tn.map((t, i) => i === 0 ? ex(-60) : ''), ''];
    this.save(X, this.wb(X, [
      ['נהגים', [this.dHead(), row]],
      ['רכבים', [this.vHead(), ['654321', tn[0]?.name || 'האמר', un[0] || 'סוללה א׳', 45200, ex(-40), 43800, 'חניון גדודי', '']]],
      ['הסבר', [['הנחיות'], ['תאריכים בפורמט יום/חודש/שנה, למשל 15/03/2027'], ['עמודות "ריענון: <סוג רכב>" – תאריך הרענון האחרון על הסוג (נרשם כרענון, ללא חונך)'], ['נגררת חתומה ותמונות מעלים מתוך כרטיס הנהג במערכת'], ['סוללה שלא קיימת במערכת תיווצר אוטומטית; שורה בלי סוללה תסומן "ללא שיוך"'], ['נהג קיים (לפי מספר אישי) יעודכן – תאים ריקים לא ימחקו נתון קיים'], ['אפשר לייבא גם את הקובץ הישן בפורמט "צריך רענון על / עבר רענון על"']]],
    ]), 'fleet_template.xlsx');
  },

  async exportAll() {
    const X = await this.lib().catch(() => null); if (!X) return toast('לא ניתן לטעון את רכיב האקסל', 'bad');
    const D = scoped(S.data.drivers).sort(byName), V = scoped(S.data.vehicles), T = typesSorted();
    const fd = x => fmtDate(x).replace('—', '');
    const dRows = D.map(d => { const st = driverStatus(d), n = ngrOf(d); return [d.pn, d.name, d.rank, unitName(d.unitId), d.phone, d.service, d.availability, d.civilLicenseNo, d.civilGrade, fd(d.civilExp), ...T.map(t => fd(lastRef(d, t.id)?.date)), d.notes,
      n ? fd(n.date) : '', n ? fd(ngrExp(n)) : '', n ? n.typeIds.map(typeName).join(', ') : '', n?.signer || '', mentorTypes(d).map(typeName).join(', '), missingDocs(d).join(', '), st.label, st.reasons.join('; ')]; });
    const vRows = V.map(v => { const st = vehicleStatus(v), s = vService(v); return [v.number, typeName(v.typeId), unitName(v.unitId), v.km, fmtDate(v.lastServiceDate).replace('—', ''), v.lastServiceKm, v.location, v.notes, s?.dueDate ? fmtDate(s.dueDate) : '', s?.dueKm ?? '', st.label, st.reasons.join('; ')]; });
    const fRows = scoped(S.data.faults).map(f => { const v = Store.get('vehicles', f.vehicleId); return [v?.number, typeName(v?.typeId), unitName(f.unitId), f.text, f.severity, f.status, fmtDateTime(f.openedAt), f.openedBy, fmtDateTime(f.closedAt), f.closeNote]; });
    this.save(X, this.wb(X, [
      ['נהגים', [[...this.dHead(), 'נגררת – נחתמה', 'נגררת – בתוקף עד', 'נגררת – רכבים', 'חתם', 'חונך על', 'מסמכים חסרים', 'סטטוס', 'פירוט'], ...dRows]],
      ['רכבים', [[...this.vHead(), 'טיפול הבא (תאריך)', 'טיפול הבא (ק״מ)', 'סטטוס', 'פירוט'], ...vRows]],
      ['תקלות', [['מספר רכב', 'סוג', 'סוללה', 'תקלה', 'חומרה', 'סטטוס', 'נפתחה', 'ע״י', 'נסגרה', 'מה בוצע'], ...fRows]],
    ]), `fleet_${todayISO()}.xlsx`);
    toast('הקובץ ירד');
  },

  async importFile() {
    if (!isAdmin()) return;
    const file = await pickFile('.xlsx,.xls,.csv'); if (!file) return;
    const X = await this.lib().catch(() => null); if (!X) return toast('לא ניתן לטעון את רכיב האקסל', 'bad');
    let wb;
    try { wb = X.read(await file.arrayBuffer(), { type: 'array' }); }
    catch (e) { return toast('הקובץ לא נקרא: ' + e.message, 'bad'); }
    const plan = this.plan(X, wb);
    if (!plan.drivers.length && !plan.vehicles.length) return toast('לא נמצאו בקובץ עמודות "מספר אישי" או "מספר רכב"', 'bad');
    const nNewD = plan.drivers.filter(x => x.isNew).length, nNewV = plan.vehicles.filter(x => x.isNew).length;
    modal({
      title: 'יבוא מאקסל – ' + file.name, submit: 'יבוא', size: 'lg',
      body: `<div class="kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px">
          <div class="card kpi" style="cursor:default"><div class="lbl">${ic('users')}נהגים</div><div class="val">${plan.drivers.length}</div><div class="foot">${nNewD} חדשים · ${plan.drivers.length - nNewD} יעודכנו</div></div>
          <div class="card kpi" style="cursor:default"><div class="lbl">${ic('truck')}רכבים</div><div class="val">${plan.vehicles.length}</div><div class="foot">${nNewV} חדשים · ${plan.vehicles.length - nNewV} יעודכנו</div></div></div>
        ${plan.cols.length ? `<div class="reasons info" style="margin-bottom:10px">${ic('info')}<span>עמודות שזוהו: ${plan.cols.map(esc).join(' · ')}</span></div>` : ''}
        ${plan.newUnits.length ? `<div class="reasons info" style="margin-bottom:10px">${ic('info')}<span>סוללות חדשות שייווצרו: <b>${plan.newUnits.map(esc).join(', ')}</b></span></div>` : ''}
        ${plan.newTypes.length ? `<div class="reasons info" style="margin-bottom:10px">${ic('info')}<span>סוגי רכב חדשים שייווצרו: <b>${plan.newTypes.map(esc).join(', ')}</b> (אפשר לעדכן להם מרווח טיפולים בהגדרות)</span></div>` : ''}
        ${plan.skipped.length ? `<div class="reasons warn">${ic('alert')}<div><b>${plan.skipped.length} שורות ידולגו:</b><ul style="margin-top:4px">${plan.skipped.slice(0, 8).map(s => `<li style="font-weight:400">${esc(s)}</li>`).join('')}</ul>${plan.skipped.length > 8 ? `<small>ועוד ${plan.skipped.length - 8}</small>` : ''}</div></div>` : ''}
        <p class="t-muted" style="margin:12px 0 0;font-size:13px">רשומות קיימות יתעדכנו לפי מספר אישי / מספר רכב. תאים ריקים בקובץ לא ימחקו נתונים קיימים.</p>`,
      onSubmit: () => { this.apply(plan); },
    });
  },

  /* reads any sheet whose header (first 10 rows) has a personal-number or vehicle-number column.
     supports a 2-row header: a group row ("עבר רענון על" / "צריך רענון על") above vehicle-type names. */
  plan(X, wb) {
    const out = { drivers: [], vehicles: [], newUnits: [], newTypes: [], skipped: [], cols: [], _units: [], _types: [] };
    const unitByName = new Map(S.data.units.map(u => [norm(u.name), u.id]));
    const typeByName = new Map(S.data.types.map(t => [norm(t.name), t.id]));
    const unitId = name => {
      const k = norm(name); if (unitByName.has(k)) return unitByName.get(k);
      const id = 'u' + uid(); unitByName.set(k, id); out.newUnits.push(name); out._units.push({ id, name, order: S.data.units.length + out.newUnits.length });
      return id;
    };
    const typeId = name => {
      const k = norm(name); if (typeByName.has(k)) return typeByName.get(k);
      const id = 't' + uid(); typeByName.set(k, id); out.newTypes.push(name); out._types.push({ id, name, grade: '', serviceDays: 180, serviceKm: 5000 });
      return id;
    };
    const str = v => String(v ?? '').trim();
    const num = v => { const n = Number(String(v).replace(/[^\d.]/g, '')); return str(v) === '' || isNaN(n) ? '' : n; };
    const seenD = new Map();
    for (const sn of wb.SheetNames) {
      const A = X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: true });
      let h = -1, kind = null;
      for (let i = 0; i < Math.min(10, A.length) && h < 0; i++) {
        if (A[i].some(c => keyOf(DKEYS, c) === 'pn')) { h = i; kind = 'd'; }
        else if (A[i].some(c => keyOf(VKEYS, c) === 'number')) { h = i; kind = 'v'; }
      }
      if (h < 0) continue;
      const top = A[h], nxt = A[h + 1] || [];
      const isSub = blank(nxt[0]) && nxt.filter(x => typeof x === 'string' && x.trim()).length >= 2;
      const width = Math.max(top.length, isSub ? nxt.length : 0);
      const cols = []; let carry = '';
      for (let c = 0; c < width; c++) {
        const t = str(top[c]); if (t) carry = t;
        const sub = isSub ? str(nxt[c]) : '';
        const head = t || (sub ? carry : '');
        let cl = null;
        if (kind === 'v') { const k = keyOf(VKEYS, head); if (k) cl = { f: k }; }
        else if (sub) {
          if (/צריך|היתר|מורשה/.test(head)) cl = { perm: sub };
          else if (/רענון|ריענון|עבר|בוצע/.test(head)) cl = { ref: sub };
        }
        if (!cl && kind === 'd') {
          const k = keyOf(DKEYS, head);
          if (k) cl = { f: k };
          else { const m = head.match(/^(?:ריענון|רענון)\s*[:\-–]?\s*(.+)$/); if (m) cl = { ref: m[1].trim() }; }
        }
        cols.push(cl);
        if (cl) out.cols.push(cl.f ? head : cl.ref ? 'ריענון ' + cl.ref : 'היתר ' + cl.perm);
      }
      const rows = A.slice(h + (isSub ? 2 : 1));
      rows.forEach((r, i) => {
        const line = `${sn} שורה ${h + (isSub ? 3 : 2) + i}`;
        const rec = {}; const permits = {}; let refAll = '';
        cols.forEach((cl, c) => {
          if (!cl) return; const v = r[c];
          if (cl.f) rec[cl.f] = v;
          else if (cl.ref) { if (!blank(v)) { const d = toISO(v); const id = typeId(cl.ref); if (d) permits[id] = d; else if (!(id in permits)) permits[id] = ''; } }
          else if (cl.perm) { if (!blank(v)) { const id = typeId(cl.perm); if (!(id in permits)) permits[id] = ''; } }
        });
        if (kind === 'd') {
          const pn = str(rec.pn).replace(/\.0+$/, '').replace(/\D/g, '');
          if (!pn) return;
          if (pn.length < 5 || pn.length > 9) { out.skipped.push(`${line}: מספר אישי לא תקין (${str(rec.pn)})`); return; }
          const exist = Store.get('drivers', safeId(pn)) || seenD.get(pn);
          const name = str(rec.name);
          if (!exist && !name) { out.skipped.push(`${line}: חסר שם לנהג חדש`); return; }
          str(rec.permits).split(/[,;\/]+/).map(s => s.trim()).filter(Boolean).forEach(n => { const id = typeId(n); if (!(id in permits)) permits[id] = ''; });
          if (!blank(rec.refAll)) refAll = toISO(rec.refAll);
          if (refAll) for (const k of Object.keys(permits)) if (!permits[k]) permits[k] = refAll;
          let hasMil = null, milExp = blank(rec.milExp) ? '' : toISO(rec.milExp);
          if (!blank(rec.milHas)) { const d = toISO(rec.milHas); if (d) { milExp = milExp || d; hasMil = true; } else hasMil = yesNo(rec.milHas); }
          const grade = str(rec.civilGrade).toUpperCase().replace(/\s/g, '').replace(/^CE$/, 'C+E');
          const unit = blank(rec.unit) ? null : unitId(str(rec.unit));
          const dd = {
            isNew: !exist, pn, name, rank: str(rec.rank), unitId: unit, phone: str(rec.phone), service: str(rec.service), availability: str(rec.availability), civilLicenseNo: str(rec.civilLicenseNo).replace(/\.0+$/, ''),
            civilGrade: GRADES.includes(grade) ? grade : '', civilExp: blank(rec.civilExp) ? '' : toISO(rec.civilExp), hasMil, milLicenseNo: str(rec.milLicenseNo).replace(/\.0+$/, ''),
            milExp, medicalExp: blank(rec.medicalExp) ? '' : toISO(rec.medicalExp), permits, notes: str(rec.notes),
          };
          seenD.set(pn, dd); out.drivers.push(dd);
        } else {
          const number = str(rec.number).replace(/\.0+$/, '');
          if (!number) return;
          const exist = Store.get('vehicles', safeId(number));
          const tname = str(rec.type);
          if (!exist && !tname) { out.skipped.push(`${line}: חסר סוג רכב לרכב ${number}`); return; }
          out.vehicles.push({
            isNew: !exist, number, typeId: tname ? typeId(tname) : '', unitId: blank(rec.unit) ? null : unitId(str(rec.unit)),
            km: num(rec.km), lastServiceDate: blank(rec.lastServiceDate) ? '' : toISO(rec.lastServiceDate), lastServiceKm: num(rec.lastServiceKm),
            location: str(rec.location), notes: str(rec.notes),
          });
        }
      });
    }
    out.cols = [...new Set(out.cols)];
    return out;
  },

  apply(p) {
    p._units.forEach(u => Store.put('units', u));
    p._types.forEach(t => Store.put('types', t));
    const merge = (base, inc) => { const o = { ...base }; for (const [k, v] of Object.entries(inc)) if (!['isNew', 'permits', 'unitId'].includes(k) && v !== '' && v != null) o[k] = v; return o; };
    for (const d of p.drivers) {
      const id = safeId(d.pn); const ex = Store.get('drivers', id);
      const base = ex || { id, pn: d.pn, unitId: '', availability: 'ביחידה', permits: {}, events: [], suspended: { active: false } };
      let o = merge(base, d);
      o.unitId = d.unitId === null ? (base.unitId || '') : d.unitId;
      if (isV2(base)) {
        /* נהג שכבר מנוהל בשיטה החדשה: תאריכי רענון מהקובץ נוספים כרענונים; נגררת לא נוצרת מאקסל */
        const refs = [...(base.refreshers || [])];
        for (const [t, dt] of Object.entries(d.permits)) if (dt && !refs.some(r => r.typeId === t && r.date === dt)) refs.push({ id: uid(), typeId: t, date: dt, mentorId: '', mentorName: '', photo: '', source: 'excel' });
        o.refreshers = refs; delete o.permits;
      } else {
        o.permits = { ...(base.permits || {}) };
        for (const [t, dt] of Object.entries(d.permits)) if (!(t in o.permits) || (dt && (!o.permits[t] || dt > o.permits[t]))) o.permits[t] = dt;
        o = upgradeDriver(o);
      }
      Store.put('drivers', o);
    }
    for (const v of p.vehicles) {
      const id = safeId(v.number); const ex = Store.get('vehicles', id);
      const base = ex || { id, number: v.number, unitId: '', inWorkshop: false };
      const o = merge(base, v);
      o.unitId = v.unitId === null ? (base.unitId || '') : v.unitId;
      Store.put('vehicles', o);
    }
    Store.log(`יבוא מאקסל: ${p.drivers.length} נהגים, ${p.vehicles.length} רכבים`);
    toast(`יובאו ${p.drivers.length} נהגים ו-${p.vehicles.length} רכבים`);
  },

  localSaved() {
    try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return j && j.data && (j.data.drivers || []).length ? j : null; } catch (e) { return null; }
  },
  migrateLocal() {
    const j = this.localSaved(); if (!j) return toast('לא נמצאו נתונים שמורים במכשיר הזה', 'bad');
    const n = j.data.drivers.length, m = (j.data.vehicles || []).length;
    confirmBox('העלאת נתוני המכשיר לענן', `להעלות לענן ${n} נהגים ו-${m} רכבים שנשמרו בטלפון/מחשב הזה? רשומות עם אותו מזהה יעודכנו.`, () => {
      for (const c of ['units', 'types', 'drivers', 'vehicles', 'faults', 'maint']) for (const o of (j.data[c] || [])) Store.put(c, o);
      if (j.settings) Store.saveSettings(j.settings);
      Store.log(`הועלו לענן נתוני המכשיר: ${n} נהגים, ${m} רכבים`);
      toast('הנתונים הועלו לענן');
    }, 'העלאה', false);
  },
  backup() {
    const data = { app: 'gdud-fleet', version: 1, at: new Date().toISOString(), settings: S.settings, data: Object.fromEntries(COLS.filter(c => c !== 'audit').map(c => [c, S.data[c]])) };
    download(`fleet_backup_${todayISO()}.json`, new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    toast('הגיבוי ירד');
  },
  async restore() {
    const file = await pickFile('.json'); if (!file) return;
    let j; try { j = JSON.parse(await file.text()); } catch (e) { return toast('קובץ גיבוי לא תקין', 'bad'); }
    if (j.app !== 'gdud-fleet' || !j.data) return toast('זה לא קובץ גיבוי של המערכת', 'bad');
    const n = (j.data.drivers || []).length, m = (j.data.vehicles || []).length;
    confirmBox('שחזור מגיבוי', `לשחזר גיבוי מ-${fmtDateTime(j.at)} (${n} נהגים, ${m} רכבים)? רשומות עם אותו מזהה יוחלפו.`, () => {
      for (const c of COLS) for (const o of (j.data[c] || [])) Store.put(c, o);
      if (j.settings) Store.saveSettings(j.settings);
      Store.log('בוצע שחזור מגיבוי'); toast('הגיבוי שוחזר');
    }, 'שחזור');
  },
};

function toISO(v) {
  if (v === '' || v == null) return '';
  if (v instanceof Date) return iso(v);
  if (typeof v === 'number') {
    if (v < 1000) return '';
    const d = new Date(Math.round((v - 25569) * 864e5));
    return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2] - 1, +m[1]); return isNaN(d) ? '' : iso(d); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return iso(new Date(+m[1], +m[2] - 1, +m[3]));
  return '';
}

App.start();
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
